# The base job spec. Every trial is this file, submitted unedited:
#
#   hl job submit .hypothesisloop/job.yaml --hypothesis ID --theory "..." --env KEY=VALUE
job:
  image: python
  # hl-clone checks out the commit the job was submitted from and prints its directory. The image
  # carries no framework, so uv runs train.py with CPU builds of torch and torchvision from
  # PyTorch's CPU index: PyPI's torch brings CUDA, gigabytes no job here uses.
  command: ["bash", "-c", "dir=$(hl-clone) && cd \"$dir\" && exec uv run --index https://download.pytorch.org/whl/cpu --with torch==2.11.0 --with torchvision==0.26.0 train.py"]
  # No accelerator: cpu is the whole cores the job holds and pays for. Storage holds torch and the
  # Fashion-MNIST download.
  cpu: 4
  memory: 8Gi
  storage: 4Gi
  env:
    OPT_NAME: adamw
    OPT_LR: "1e-3"
    OPT_PRECOND_FREQ: "10"
    BATCH_SIZE: "1024"
    STEPS: "3000"
    TARGET_LOSS: "0.012"
    SEED: "0"
    TRAIN_DEVICE: cpu
    DATA_DIR: /tmp/fashion-mnist
    REPORT_EVERY_STEPS: "25"
