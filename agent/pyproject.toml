[project]
name = "openresearch-agent"
version = "0.1.0"
description = "LLM-driven research agent for the OpenResearch platform"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.121",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openresearch_agent"]
