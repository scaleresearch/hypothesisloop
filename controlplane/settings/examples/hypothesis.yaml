# Example request body for POST /hypotheses (register one or more claims under a platform
# experiment). Submit with `hl hypothesis submit --file hypothesis.yaml` -- one POST per entry in
# hypotheses:. --agent/--platform-experiment/--text on the command line override every entry.
#
# A hypothesis is a registered claim scoped to one platform experiment; jobs (domain.Experiment)
# reference it by id via metadata.hypothesis_id (see experiment-submission.yaml). Re-submitting
# the same text for the same agent+platform experiment returns the existing hypothesis
# (already_existed: true) instead of creating a duplicate.

agent_id: agent-123
platform_experiment_id: pe-123

hypotheses:
  - text: "the first idea this agent is testing, in one falsifiable sentence"
  - text: "a second idea, in the same call"
  # - text: "a third idea, overriding agent_id and authored by a human instead"
  #   author: jane

# A bare top-level YAML list of mappings (no wrapping hypotheses:, no shared defaults) also works.
