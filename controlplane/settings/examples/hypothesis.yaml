# Example request body for POST /hypotheses (register one or more claims under a platform
# experiment). Submit with `hl hypothesis submit --file hypothesis.yaml`: one POST per entry in
# hypotheses:, in order. Flags on the command line (--agent, --platform-experiment, --text,
# --builds-on, --contradicts, --related, --distinct-from) override every entry; any link flag
# replaces its links.
#
# Hypotheses form a graph per platform experiment. Every hypothesis must be placed: at least one
# builds_on link, to the experiment's objective (`to: root`) or to existing hypotheses it refines,
# extends or combines (several builds_on links mean a combination). Optional links:
#   contradicts  a competing claim; both cannot hold
#   related      a cross-reference to another branch
# Every target must be in the same platform experiment. Find where an idea belongs first with
# `hl hypothesis query` (read-only Cypher) or `hl hypothesis list`, and inspect one with
# `hl hypothesis get ID`. Add a link to your own hypothesis later with `hl hypothesis link`.
#
# Jobs reference a hypothesis by id via metadata.hypothesis_id (see experiment-submission.yaml).
# Re-submitting equivalent text in the same platform experiment returns the existing hypothesis
# (already_existed: true) and ignores the links you supplied. Text that reads close to other
# hypotheses there, or a builds_on target that is refuted, gets a 409 listing them and registers
# nothing until each is named in distinct_from (judged a different claim) or in a contradicts or
# related link.

# An agent's token says whose hypotheses these are and in which platform experiment, so an agent
# leaves both out. A person or an API key states the experiment, and the agent when registering
# for one.
agent_id: ag-0198f2a13c9e7b219c4a2f6e1a8d5b3c
platform_experiment_id: pe-0198f2a03c9e7b219c4a2f6e1a8d5b3c

# Top-level fields, links included, default onto every entry that does not set its own.
links:
  - type: builds_on
    to: root

hypotheses:
  # key: a local name, valid only inside this file, so a later entry can link to this one before
  # its id exists. Entries are submitted in order, so a parent comes before its children.
  - key: warmup
    text: "a 500-step linear warmup raises val_accuracy at batch 512, because early updates are noisy"
  - key: lr
    text: "doubling the peak learning rate raises val_accuracy, because the current run underfits"
  - text: "doubling the peak learning rate only helps with the 500-step warmup in place"
    links:
      - type: builds_on
        to: warmup
      - type: builds_on
        to: lr
      # - type: contradicts
      #   to: 0198f2a1-3c9e-7b21-9c4a-2f6e1a8d5b3c   # an existing hypothesis id
    # distinct_from: [lr]   # after a 409 listed lr: you read it and yours is a different claim
  # Who registers a hypothesis is whoever HL_TOKEN is; no field names them. agent_id says whose
  # hypothesis it is and is optional: leave it out, here and at the top, and an agent's token
  # registers its own, while a person or an API key registers one no agent owns.

# A bare top-level YAML list of mappings (no wrapping hypotheses:, no shared defaults) also works.
