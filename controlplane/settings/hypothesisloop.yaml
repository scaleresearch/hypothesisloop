# HypothesisLoop platform configuration.
# Platform-wide rates and scheduling policy live here.

#   public_api_url  the one address this API is reached at from outside the control plane: by a
#                   hosted agent from wherever its launcher rents, and by a cluster's runtime
#                   from inside its cluster. Registering a cluster hands it out. A loopback
#                   address is rejected at load.
services:
  api_port: 8081
  public_api_url: http://REPLACE-WITH-HOST-ADDRESS:8081
  metric_controller_port: 8084
  metrics_db_url: http://greptimedb:4000
  graph_db_url: bolt://memgraph:7687

# Who may call the API. Every request carries one token, and there is no setting that turns the
# check off.
#
#   identity_providers
#                     the sign-in services whose tokens the control plane accepts. Each entry is
#                     one service: its issuer, as its tokens state it, the audience it issues
#                     them for this API under, and jwt_keys, its public keys as its JWKS document
#                     gives them (kid, kty, alg and crv/x/y for ES256 or n/e for RS256). A
#                     person's token is checked against the one entry whose issuer it states.
#                     The keys are never fetched: rotating one is an edit here and a restart.
#                     With none listed no person's token is accepted. A deployment lists the
#                     service it signs people in with. Local development renders in a key made on
#                     the machine, which its tests sign their users with, and the Supabase project
#                     beside it when .env asks for one (make render-settings).
#   signing_secret    derives the hls_ tokens handed to what the platform launches (jobs, agents,
#                     coordinators, runtimes) and the staff token. A secret of the deployment, so
#                     this file names the environment variable and never holds the value: the
#                     control plane does not start without it.
#   ui_origin         the one browser origin allowed to call the API.
auth:
  identity_providers: []
  signing_secret: ${HYPOTHESISLOOP_SIGNING_SECRET}
  ui_origin: REPLACE-WITH-UI-ORIGIN

# Agents the platform runs. An agent joins through POST /platform-experiments/{id}/agents; one
# asked for with hosted: true is started by a launcher, a separate process that holds a provider
# account and asks this API which instances should exist. Nothing here names a provider.
# A platform experiment created with coordinator_hosted gets its coordinator the same way: one
# more instance of the same launcher and image, on coordinator_model unless the
# request names another.
#
#   launcher   the launcher a newly hosted agent is given to: 1 to 16 lowercase letters and
#              digits, registered with `hl-admin launcher add`. It is written onto the agent when
#              it joins, so changing this moves new agents only and running ones finish where they
#              started. A launcher's token is accepted while the launcher is registered, whatever
#              this names: one that no agent is given to any more is answered an empty list and
#              takes down what it still holds. Hosting is refused while this names a launcher
#              that is not registered.
#   image      what every hosted agent's machine boots. The launcher's provider must be able to
#              pull it. A change replaces every running agent's machine.
#   default_model  the model an agent runs on when it joins without naming one. Written onto the
#              agent when it joins, so a change moves new agents only.
#   coordinator_model  the model a hosted coordinator runs on when its create request names none,
#              a stronger one than default_model since it supervises the whole run. Written onto
#              the platform experiment when it is created, so a change moves new ones only.
#   boot_limit_seconds  how long a hosted machine may go unreported by its launcher after it was
#              asked for, or stay starting after it was first reported, before it is given up on
#              and a restart is spent: three in any six hours, the fourth stops the agent. A
#              first boot pulls the agent image (about 11 seconds on the slowest provider measured). Too low spends every restart on slow
#              pulls. Restarts are spent under one image and one launcher config: a change of
#              either gives every agent its restarts back and starts a stopped one again.
#   progress_limit_seconds  how long a running hosted machine may go without its agent reporting
#              progress before it is given up on and a restart is spent. An agent prints a
#              progress marker every 15 seconds while it works or waits as it should, its launcher
#              reads the newest one on each pass, and the limit runs on this platform's clock
#              from the last time the marker was seen to change. A hung agent is replaced between
#              one and one and a quarter limits after it stopped. At least 120, and at least
#              twice a launcher's pass as boot_limit_seconds is.
#   max_new_instances_per_answer  how many machines one answer asks a launcher to create; the
#              rest follow in the next. A launcher creates them one after another, so this bounds
#              how long a pass takes. A launcher says how it paces itself with every question and
#              is refused unless twice (this x its create pause + its interval) fits the boot
#              limit: with 10 here, the 1 s pause and 15 s interval of the launcher's example
#              settings, a pass is 25 s and the limit must be at least 50 s. A refused launcher
#              rents nothing new and still stops and destroys the machines whose run is over.
#   max_hosted_per_platform_experiment  how many machines the platform runs for one platform
#              experiment: its hosted agents of every role and its coordinator. Written onto the
#              platform experiment when it is created, so a change bounds new ones only.
#   idle_notice_minutes  how long a researcher of a running platform experiment may go with no
#              job of its own created or running since the run started or the last one
#              ended, and none queued or running, before it and the coordinator are told so
#              (agent.idle new), and again every idle_notice_minutes while the stretch lasts
#              (agent.idle continues). The same period tells whoever steers a running platform
#              experiment that its capacity holds places beyond its queued jobs (capacity.idle).
agents:
  launcher: main
  image: registry.example.invalid/hypothesisloop-experimentator-base:latest
  default_model: claude-sonnet-5
  coordinator_model: claude-opus-5-5
  boot_limit_seconds: 300
  progress_limit_seconds: 300
  max_new_instances_per_answer: 10
  max_hosted_per_platform_experiment: 25
  idle_notice_minutes: 10

# What bounds a draft: a platform experiment a person started from one sentence, which an agent
# the platform runs plans (it works out the metric, the brief and the size and proposes the
# experiment) before the person accepts and states what the run itself costs. A draft takes no
# job, so the platform pays for the planner's machine and nothing else, and all of it is bounded
# here.
#
#   limit_minutes         how long the planner has to propose, from the goal and again from each
#              revision. A draft with no proposal by then is closed and its machine released.
#   proposed_for_days     how long a proposal waits for a person before the draft is closed.
#   planner_kept_minutes  how long the planner's machine is kept after its answer, so that a
#              revision asked for in that time is answered by the planner that is still there,
#              with nothing to boot. It ends earlier at the planning limit the machine was
#              rented with, and with the accept. After it no machine runs while the answer
#              waits, and a revision starts one.
#   baseline_limit_minutes  the longest a platform experiment may stay open, counted from its
#              starts_at (its creation or acceptance, or a later one stated). One created whole
#              has all of it; an accepted draft has the baseline_minutes its planner estimated
#              and the person accepted, at most this. The platform starts the run once a
#              baseline is declared (PATCH baseline_job_id), and its duration_hours count from
#              then. One not running by its baseline_due_at is closed with close_reason
#              baseline_limit_reached and its machines are released. baseline_due_at moves out
#              by the time a job of the baseline waits for the platform to build its
#              environment or to start it, at most 90 minutes in all.
#   min_baseline_minutes  the fewest baseline_minutes a proposal or an accept may state: a
#              baseline written from nothing writes its harness, waits for its environment to
#              build and measures once, and a shorter window closes the run before it starts.
#   auto_accept_seconds  how long a proposal waits before the platform accepts it as proposed,
#              unless a person accepts it sooner, holds it to edit it, revises it or closes
#              it. Its baseline agent's machine starts with the proposal, so measuring begins
#              as the proposal is accepted. 0 leaves every proposal to a person.
planning:
  limit_minutes: 30
  proposed_for_days: 7
  planner_kept_minutes: 10
  baseline_limit_minutes: 90
  min_baseline_minutes: 45
  auto_accept_seconds: 30

# What one account may create. Staff, the platform's operators, are held to neither.
#
#   max_orgs_per_user     how many orgs a person may own when they create one. The home org of
#              their first sign-in counts.
#   max_projects_per_org  how many projects an org may hold, its default project included.
accounts:
  max_orgs_per_user: 3
  max_projects_per_org: 10

# What a cluster's runtime is installed with, beside services.public_api_url. Registering a
# cluster returns all of it beside its runtime token, so the command that starts the cluster's
# agents has one source. The address must be reachable outbound from inside every cluster and the
# registry from every node, so a loopback address is rejected at load.
#
#   metrics_url   the metrics service.
#   registry      the registry the runtime's images are pulled from (host[:port][/path], no
#                 scheme): where `make images REGISTRY=...` pushed.
#   image_tag     the tag of those images. One deployment runs one tag: the control plane's own.
runtimes:
  metrics_url: http://REPLACE-WITH-HOST-ADDRESS:8084
  registry: REPLACE-WITH-HOST-ADDRESS:5000
  image_tag: REPLACE-WITH-IMAGE-TAG

# The images the deployment offers a job to run in, so that an agent need not install a
# framework into a bare image on every run. `hl capacity` lists them and names, on each
# accelerator type's line, the ones that suit it. A job may name any other image.
#
#   name        what the image is called in `hl capacity`.
#   repository  an image this deployment builds and pushes: its name under runtimes.registry,
#               at runtimes.image_tag. `make images` builds the bare one, `make job-images` the
#               others, each the upstream image named below with hl, hl-clone, git and uv added
#               (infra/images/job/Dockerfile).
#   image       a whole reference instead, for an image built elsewhere. One of the two.
#   environment_base  beside repository, the same image without hl and hl-clone, under
#               runtimes.registry at runtimes.image_tag (infra/images/job/Dockerfile.base). An
#               environment of a job on the image is built on it and gets hl and hl-clone from
#               the image last, so what its file installs stays cached while only they change.
#               Left out, an environment is built on the image itself.
#   carries     what is installed, which is what an agent chooses by.
#   suits       prefixes of accelerator type names. Left out: every type.
job_images:
  - name: python
    repository: hypothesisloop-job
    environment_base: hypothesisloop-job-base
    carries: Python 3.13, uv, git, hl, hl-clone. No framework. On NVIDIA, torch from PyPI declared in .hypothesisloop/Dockerfile brings its own CUDA and cuDNN; the host provides the driver.
  # From ghcr.io/tenstorrent/tt-metal/tt-metalium-ubuntu-22.04-release-amd64:v0.77.0, which ships
  # no torch: the Makefile adds the CPU build at the version named here.
  - name: tenstorrent
    repository: hypothesisloop-job-tenstorrent
    environment_base: hypothesisloop-job-tenstorrent-base
    carries: tt-metal and ttnn v0.77.0 with device firmware, PyTorch 2.11.0 (CPU build) and numpy 1.26, Python 3.10 in /opt/venv, uv, git, hl, hl-clone. python3 is that venv, so import torch and ttnn work as is. Do not install torch again or run in a new venv, either downloads it at every job start. Add other packages with uv pip install.
    suits: ["tenstorrent.com/"]

# Environments: a repository's .hypothesisloop/Dockerfile, beginning ARG BASE and FROM ${BASE}, is
# built once per org, content and base by a cluster that builds and is open to the org, which the
# control plane assigns each build to, and pushed here. A job runs in the one its commit declares,
# built on its job image. Agents run agents.image and build nothing. While no such cluster is
# registered, a job that declares an environment is refused with no_environment_builder.
#
# Left out, as here, the deployment builds no environments: no cluster counts as building, so every
# such job is refused. To switch it on, add the section with the repository, its registry's provider
# and that provider's own section. A deployment's chart gets them from its values, and local
# development's render from .env (localdev/lib/auth.sh):
#
#   environments:
#     repository: europe-west1-docker.pkg.dev/my-project/hypothesisloop-environments/environment
#     provider: gcp
#     gcp:
#       pusher: env-pusher@my-project.iam.gserviceaccount.com
#       puller: env-puller@my-project.iam.gserviceaccount.com
#
#   repository  the whole address every environment image is pushed to, by digest and with no
#               tag, in a repository that no one reads without a login.
#   provider    the registry that holds it, which decides how the control service mints the
#               logins: a cluster is handed a push login for each build it is assigned, and a pull
#               login in each reconcile answer that lists a job running in an environment, which
#               the job's image is pulled with. One of:
#     gcp       Google Artifact Registry. pusher is the service account with write on the
#               repository, and puller the one with read. The control service mints their tokens
#               as its own Google identity: its application default credentials
#               (GOOGLE_APPLICATION_CREDENTIALS, the service account it runs as, or gcloud auth
#               application-default login), which holds roles/iam.serviceAccountTokenCreator on
#               both. It does not start without them.

# The git host platform experiments keep their code on. Required: this file names none, and each
# deployment adds the section when it renders the file. provider names the host, and the section
# of that name, the only one set, configures it. github is the platform's GitHub App: a person
# installs it on repositories they choose and attaches one to a project; agents and jobs then
# clone it with tokens minted per repository, each good for about an hour and stored nowhere.
#
#   git_host:
#     provider: github
#     github:
#       app_id: 123456
#       app_slug: hypothesisloop
#       client_id: Iv23...
#       client_secret: ${HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_CLIENT_SECRET}
#       private_key: ${HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_PRIVATE_KEY}
#
#   app_id, app_slug   the App's number and the name in its URL.
#   client_id, client_secret
#                      the App's own OAuth pair. They prove, once per attach, that the person
#                      attaching a repository can push to it. The person's token is dropped after.
#   private_key        the PEM GitHub issued for the App. It signs the request for every token.
#
# The App asks for the permissions controlplane/shared/githost/github/app-manifest.json states, and
# an installation that has not granted all of them is refused, naming those it lacks.
#
# plain is any host that serves repositories under one root:
#
#   git_host:
#     provider: plain
#     plain:
#       base_url: https://git.example.com/experiments
#       username: platform
#       password: ${HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD}
#
#   base_url   the https root of any git host. A repository is a name under it, created on the host
#              beforehand: the platform creates none there and reads no experiment file from one.
#   allow_http true lets base_url be http, for a host on the deployment's own network, as local
#              development's is. The credential then travels in the clear.
#   username, password
#              what the host takes, both left out for a host that asks for nothing.
#
# The plain credential is deployment-wide: every agent, coordinator and job of every org is handed
# the same one, and it reads and writes whatever that account reaches on the host. Secrets are
# named here as environment variables and never held in this file.

# Durable data between jobs — checkpoints and datasets one job produces and another needs.
#
# An S3-compatible object store, addressed rather than attached: a volume belongs to one cluster
# and admission places jobs across clusters, so anything attached pins every later stage to
# wherever the first one landed. Each job is handed HYPOTHESISLOOP_DATA_URI (its own prefix,
# writable) and HYPOTHESISLOOP_DATA_SHARED (the platform experiment's prefix, readable), plus
# AWS_* credentials its own client reads. The layout is <platform-experiment>/<agent>/<job>/.
#
# The credentials are the job's own permanent key, created at submission and limited to writing the
# job's prefix and reading its platform experiment's. S3 has no call that creates a key, so how it is
# created is the store's own, which provider names. One of:
#
#   minio  the MinIO admin API (MinIO, Silo, AIStor): the job's key is a service account of the key
#          below, which must be allowed to create service accounts. The store's root user is.
#
# The platform is not in the data path: it lists prefixes and measures them, and nothing more.
# Expiry is a lifecycle rule configured on the bucket itself — one rule, enforced where the bytes
# are, with no sweeper here to fail silently.

data_store:
  provider: minio
  # The address every job and agent is handed. MUST be one job pods reach, never
  # localhost/127.0.0.1 — a job pod (k3s) has its own network namespace and cannot reach the
  # host's loopback, so a loopback endpoint works everywhere except the one place that matters and
  # fails hours into a run with nothing saved. The same rule the shared code repo's URL follows.
  # `make render-settings` fills in host.containers.internal
  # on macOS and the LAN address on a Linux host. Loaded config rejects a loopback endpoint rather
  # than letting it through. The control plane sends none of its own requests here.
  endpoint: http://REPLACE-WITH-HOST-ADDRESS:9000
  # Where the control plane itself reaches the store, on its own network: every read and write it
  # makes (sessions, listings, job keys) goes here, so none of them waits on a tunnel or a load
  # balancer that exists for machines elsewhere. Required, and never taken from endpoint. The
  # compose stack's name for the store; `make dev` renders localhost for its host processes.
  control_plane_endpoint: http://minio:9000
  region: us-east-1
  bucket: hypothesisloop-data
  access_key_id: hypothesisloop
  secret_access_key: hypothesisloop

  # How many bytes one agent may hold within one platform experiment. Checked at admission
  # against what the store reports right now, never mid-write: enforcing a ceiling mid-write
  # needs a gateway in the data path, and a job killed as it saves loses the run it was about to
  # preserve. Required and positive.
  max_bytes_per_agent: 214748364800


# Accelerator types — priced hardware.
#
# A type is named by a fact its own driver publishes, written as a fully-qualified "key=value":
#
#   nvidia.com/gpu.product=NVIDIA-H100-80GB-HBM3   NVIDIA GPU Feature Discovery node label
#   amd.com/gpu.product-name=Instinct-MI300X       AMD node labeller node label
#   tenstorrent.com/chipArch=blackhole             Tenstorrent DRA device attribute
#
# These strings are NOT defined here. The driver emits them; this file only attaches a price.
# The same string is what an agent writes as job.accelerator_type, what /resource-catalog/capacity
# reports, what quota bills, and what is labelled on the job's pods — there is no mapping table
# anywhere, because a mapping is a place where two names can disagree.
#
# To see what a cluster actually publishes, read /resource-catalog/capacity: anything listed
# there is a valid name; adding an entry below is what makes it billable (and therefore
# submittable). Any vendor, any model, any granularity you care to price — nothing in the code
# is a closed enum. A device is reported under every fact true of it, so pick the granularity
# you want to bill at: pricing tenstorrent.com/chipArch=blackhole bills every Blackhole board
# alike, while tenstorrent.com/boardType=7 would price one board model.
#
# acch_rate is cost in accelerator-hours (AccH), H100-equivalent (H100 = 1.0).
#
# hypothesisloop.dev/cpu=core is the one type that is no device: one unit is one CPU core. Every
# runtime offers its nodes' cores as it, and a job that asks for cores and no accelerator (cpu: 4)
# holds that many units. It is built in at 1.0, so the budget of an experiment on cores reads as
# CPU core-hours: 4 cores for an hour cost 4. It is not listed below, and a file that lists it is
# refused at load.
#
# pod_resources is what every node of a job on the type needs beside the device, by the name the
# runtime knows it. The platform adds it to every job admitted on the type, so no job spec states
# it: a Tenstorrent chip's driver maps 1 GiB hugepages, and a job without them dies opening the
# device. On Kubernetes it is a resource request of the pod; a bare node mounts the host's
# hugetlbfs of that size into the container.
#
# Accelerators are the resource dimension admitted/preempted on. RAM/storage are hard
# physical-fit-checked at admission instead of hours-quota-tracked. Agents declare accelerator
# count as a plain integer in job.yaml's accelerator_count, never a k8s resource string.

accelerator_types:
  - name:      nvidia.com/gpu.product=Tesla-T4
    acch_rate: 0.125

  - name:      nvidia.com/gpu.product=NVIDIA-L40
    acch_rate: 0.25

  - name:      nvidia.com/gpu.product=NVIDIA-A100-80GB-PCIe
    acch_rate: 0.375

  - name:      nvidia.com/gpu.product=NVIDIA-H100-80GB-HBM3
    acch_rate: 1.0

  - name:      nvidia.com/gpu.product=NVIDIA-H200
    acch_rate: 1.25

  - name:      nvidia.com/gpu.product=NVIDIA-GEFORCE-RTX-4070-TI
    acch_rate: 0.1

  - name:      nvidia.com/gpu.product=NVIDIA-GeForce-RTX-4090
    acch_rate: 0.15

  - name:      nvidia.com/gpu.product=NVIDIA-GEFORCE-GTX-1070-TI
    acch_rate: 0.05

  # Add a rate when jobs may request another accelerator type.
  # - name:      amd.com/gpu.product-name=Instinct-MI300X
  #   acch_rate: 1.125

  - name:      tenstorrent.com/chipArch=blackhole
    acch_rate: 0.5
    pod_resources:
      hugepages-1Gi: 4Gi

# Quota & scheduling constants

quota:
  # Fraction of base_share added as a bonus for top-3 placement in any prior experiment.
  top3_bonus_fraction: 0.25

  # burst_quota = guaranteed_quota * burst_fraction: how much an agent may run at burst priority,
  # on idle capacity. Burst hours come out of the agent's share of the experiment budget and are
  # never on top of it, so a value over 1 only lets the whole share run as burst.
  burst_fraction: 2.0

  # Maximum number of experiments an agent may submit per hour within a single platform
  # experiment. Prevents queue flooding. Required and positive.
  max_submissions_per_hour: 100

  # Accelerators-in-flight (SUBMITTED+RUNNING) a platform experiment may hold at once when it
  # does not set its own max_concurrent_accelerators. Speculative submission makes capacity
  # appear on demand, so this is the concurrency ceiling that live capacity used to provide.
  default_max_concurrent_accelerators: 64

  # The tier of a signup that states no quota_tier, in a platform experiment that states no
  # default_quota_tier of its own: guaranteed (a reserved share and burst on top) or burst_only.
  default_quota_tier: guaranteed

  # The longest a platform experiment may run: the most its duration_hours may state, counted
  # from the moment the run starts. A longer one is refused with 422 run_too_long when it is
  # created, proposed, accepted or patched. Until its end an experiment may rent machines, so
  # this and its budget are what bound it.
  max_platform_experiment_days: 30

  # Per-job maximum caps — checked at admission, before any quota debit, so one absurd
  # submission can never consume an entire guaranteed/burst budget in a single shot. This is
  # independent of (and on top of) budget sizing: size these relative to your smallest
  # expected burst pool, not just to "a sane job." Each is required and positive.
  max_accelerator_count_per_job: 16
  max_cpu_cores_per_job: 64
  max_ram_gb_per_job: 512
  max_storage_gb_per_job: 1000



# Scheduler & controller timing

scheduler:
  # How often the admission loop ticks (picks up queued experiments).
  loop_heartbeat_seconds: 10

  # Pod shutdown grace period: default when a job doesn't request its own, and the cap on
  # whatever a job does request.
  default_termination_grace_period_seconds: 5
  max_termination_grace_period_seconds: 30

  # The cap on job.checkpoint_grace_seconds: how long a job may be given, after it is told a
  # policy-class termination (preemption, a stage cut, quota exhaustion, the duration cap) is
  # coming, to write a checkpoint it can resume from. Separate from the shutdown grace above
  # because 30s does not checkpoint a serious model -- and capped, because a job must not hold
  # contended accelerators indefinitely by claiming it is still saving.
  max_checkpoint_grace_seconds: 600

  # One line of a job's reported log tail is split on ingest (never truncated/dropped) above this
  # many characters -- large enough to keep a real compiler error or stack frame intact, small
  # enough that one pathological line can't blow up a stored tail.
  max_log_tail_line_chars: 2000

  # How often the JobWatcher polls a running k8s Job for phase transitions.
  job_poll_interval_seconds: 5

  # How long a job may stay SUBMITTED without reporting RUNNING before job_watcher
  # evicts it (reason stuck_pending) and fully refunds its reservation. Bounds capacity held by
  # jobs that never actually start (e.g. unschedulable). A job's own checkpoint window is added,
  # since a requeued job cannot start before its previous pod has finished checkpointing.
  # For a job whose runtime reports what it waits for (a machine to rent, a rented machine
  # starting), the time counts from the runtime's first report of that wait.
  # Overridable per cluster in the cluster's settings, for a cluster whose nodes boot slowly.
  stuck_pending_timeout_seconds: 300

  # How long a placed job may stay pending (image pull, container creation) before the same eviction.
  start_timeout_seconds: 1800

  # How stale a cluster-agent's heartbeat may be before the cluster is treated as Unreachable:
  # its live-reported capacity ages out of admission (freezing new jobs to it) and it shows
  # Disconnected in the UI. Jobs already RUNNING there are left alone until it reconnects.
  # ~15 missed polls at the ~2s desired-state cadence.
  cluster_unreachable_after_seconds: 30

  # How long a cluster may push no job-status snapshot at all before the jobs it still holds are
  # evicted as cluster_unreachable and their reservations released. Far longer than
  # cluster_unreachable_after_seconds above, which only freezes admission to the cluster: this
  # one ends real work, so it must comfortably outlast a control-plane restart, a rolling
  # cluster-agent upgrade, and a transient network partition.
  cluster_status_silence_ceiling_seconds: 900

  # How many times one experiment may go back to the queue for free after an infrastructure
  # fault (cluster_unreachable, workload_gone, stuck_pending, flavor_mismatch,
  # accelerator_type_unobservable, code_unreachable, no_offer). Those attempts cost no max_retries budget and no
  # accelerator-hours -- the environment failed the job, not the agent. Past this ceiling the
  # job stops and stays EVICTED with the reason that kept ending it.
  max_infrastructure_requeues: 3

  # Global default deadline for an autoscaler-enabled cluster to deliver capacity for a
  # SUBMITTED/RUNNING job's incomplete gang before job_watcher evicts it (reason
  # scale_up_timeout) and fails it over to the next candidate cluster. Overridable per cluster
  # in the cluster's settings. Must be < 1800: PyTorch's default rendezvous store timeout is 30
  # minutes, and waiting past that turns a scheduling failure into a real job failure.
  scale_up_timeout_seconds: 600

  # How long a cluster stays excluded from a job's speculative candidates after that job failed
  # over off it. Past the TTL the cluster is eligible again for that job.
  tried_cluster_ttl_seconds: 900

  # Age-bucket width for guaranteed-tier admission fairness: jobs queued within this window of
  # each other are ordered by least-used-quota agent first instead of exact FIFO timestamp,
  # bounding how far a steady-submitting agent's own jobs can jump ahead of other agents'
  # equally-entitled jobs.
  guaranteed_fairness_window_seconds: 60

  # The least a job waits in the queue before its agent and its coordinator are told that it is
  # held and why, with one job.held event per job. A job is told once it has waited longer than
  # this and longer than its own estimated duration, so a short job is not announced for an
  # ordinary wait and a long one only when the wait has outlasted the run itself. The job stays
  # queued: the event carries the queue reason, and what to do about it is its owner's choice.
  held_job_notice_seconds: 300

  # Evict a RUNNING job whose CPU/memory/storage request exceeds this multiple of its
  # proportionate per-accelerator share of the cluster, while that request is provably the only
  # thing keeping a queued job off idle accelerators on the same node. Guards against a job
  # taking one of a node's four accelerators and all of its cores, stranding the other three.
  # Required and positive — there is no off switch: a disabled pass is a second scheduling
  # behaviour to reason about, and stranded accelerators are stranded whether or not an operator
  # switched the fix on. 3 is the suggested value — a job is entitled to its proportionate share,
  # and three times that is already past any plausible host-side need.
  resource_disbalance_tolerance: 3

  # How often the metric controller reconciles running experiments.
  reconcile_interval_seconds: 5

  # Default silence cadence when a platform experiment does not define one.
  default_report_interval_seconds: 30

  # Multiplier on report_interval_seconds; no metric push for this many intervals triggers eviction.
  silence_multiplier: 3.0

  # Floor on the silence window (silence_multiplier * report_interval_seconds), regardless of
  # how short a platform experiment's own report_interval_seconds is configured. Must comfortably
  # exceed realistic node-death -> reschedule -> pod-running-again recovery time, or a fast
  # reporting cadence turns a normal self-heal into a false permanent eviction.
  min_silence_window_seconds: 300

  # Kubernetes Job retries (RestartPolicy=OnFailure) before k8s marks the Job Failed.
  # Absorbs transient pod flakes; a persistently crashing job exhausts these retries and is
  # failed natively by k8s (job watcher then records FAILED and refunds unused AccH).


# Stages — the elimination ladder
#
# An ordered list of stages:
#   length_pct     share of the experiment this stage spans; all stages must sum to 100
#   evict_pct      share of *surviving* agents cut when the stage ends; 0 cuts nobody
#   max_job_hours  longest a single job may run while this stage is current; 0 (the default,
#                  and what you get by omitting it) is unlimited. Enforced twice: a submission
#                  estimating more is rejected job_too_long, and a job that outruns the cap is
#                  evicted job_too_long against its observed runtime. A short cap on the first
#                  stage buys many small exploratory runs; leave it off later so validated
#                  ideas can run long.
#
# Progress across the ladder is max(budget_consumed / total_budget, elapsed / duration), so
# whichever runs out first advances it. The final stage must have evict_pct 0 — nothing
# follows it. Fixed at creation per platform experiment; this is only the default applied to
# a platform experiment created without its own ladder.
#
#   [{length_pct: 100, evict_pct: 0}]                       one stage, no cuts
#   [{20,25}, {30,25}, {50,0}]                              three stages, a quarter cut twice
#   [{length_pct: 30, evict_pct: 25, max_job_hours: 1},     explore in <=1h runs, then no limit
#    {length_pct: 70, evict_pct: 0}]

stages:
  default:
    - length_pct: 40
      evict_pct: 75
    - length_pct: 60
      evict_pct: 0
