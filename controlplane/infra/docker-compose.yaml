networks:
  hypothesisloop-net:
    driver: bridge

volumes:
  postgres-data:
  greptimedb-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hypothesisloop
      POSTGRES_USER: hypothesisloop
      POSTGRES_PASSWORD: hypothesisloop
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../shared/db/schema.sql:/schema/schema.sql:ro
    ports:
      - "5433:5432"
    networks:
      - hypothesisloop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypothesisloop -d hypothesisloop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hosts the entire agent- and UI-facing API on one port (8081) —
  # scheduler already calls straight into the quota package for refunds/adjustments,
  # so they share one Postgres connection pool instead of duplicating it.
  control-service:
    image: hypothesisloop-control-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hypothesisloop:hypothesisloop@postgres:5432/hypothesisloop?sslmode=disable
      # Scheduler admission (queuebackend.Backend.GetFlavorCapacity) reads live
      # accelerator/RAM/storage capacity straight from the metrics store — without this, every
      # job needing one of those dimensions sees zero capacity and Fits() fails closed forever.
    volumes:
      - ../settings/hypothesisloop.yaml:/settings/hypothesisloop.yaml:ro
    ports:
      - "8081:8081"
    networks:
      - hypothesisloop-net
    depends_on:
      postgres:
        condition: service_healthy
      greptimedb:
        condition: service_started

  # Hosts the internal metric-controller only (8084) —
  # registry writes samples to GreptimeDB and metric-controller reads them back to
  # drive eviction, so they're the write/read halves of the same metrics pipeline.
  metrics-service:
    image: hypothesisloop-metrics-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hypothesisloop:hypothesisloop@postgres:5432/hypothesisloop?sslmode=disable
    volumes:
      - ../settings/hypothesisloop.yaml:/settings/hypothesisloop.yaml:ro
    ports:
      - "8084:8084"
    networks:
      - hypothesisloop-net
    depends_on:
      postgres:
        condition: service_healthy
      greptimedb:
        condition: service_started

  # GreptimeDB (standalone) replaces Prometheus + Pushgateway as the metrics storage
  # backend. It is Prometheus remote-write and PromQL compatible: registry-service
  # pushes samples to /v1/prometheus/write, and metric-controller/registry-service
  # read them back via /v1/prometheus/api/v1/query. The per-service /metrics endpoints
  # (client_golang, promhttp) are unchanged and remain in Prometheus exposition format.
  greptimedb:
    image: greptime/greptimedb:latest
    restart: unless-stopped
    command:
      - "standalone"
      - "start"
      - "--http-addr=0.0.0.0:4000"
      - "--rpc-bind-addr=0.0.0.0:4001"
    volumes:
      - greptimedb-data:/tmp/greptimedb-data
    ports:
      - "4010:4000" # HTTP / PromQL / remote-write (host port 4000 already used by another service on this host)
      - "4001:4001" # gRPC
    networks:
      - hypothesisloop-net

  # ui: run separately with `cd ui && npm run dev` (no container Dockerfile yet)
