# HypothesisLoop platform configuration.
# Platform-wide rates and scheduling policy live here.

services:
  api_port: 8081
  metric_controller_port: 8084
  metrics_db_url: http://greptimedb:4000


# Durable data between jobs — checkpoints and datasets one job produces and another needs.
#
# An S3-compatible object store, addressed rather than attached: a volume belongs to one cluster
# and admission places jobs across clusters, so anything attached pins every later stage to
# wherever the first one landed. Each job is handed HYPOTHESISLOOP_DATA_URI (its own prefix,
# writable) and HYPOTHESISLOOP_DATA_SHARED (the platform experiment's prefix, readable), plus
# AWS_* credentials its own client reads. The layout is <platform-experiment>/<agent>/<job>/.
#
# The platform is not in the data path: it lists prefixes and measures them, and nothing more.
# Expiry is a lifecycle rule configured on the bucket itself — one rule, enforced where the bytes
# are, with no sweeper here to fail silently.

data_store:
  # MUST be the host's LAN address, never localhost/127.0.0.1 — a job pod (k3s) has its own
  # network namespace and cannot reach the host's loopback, so a loopback endpoint works
  # everywhere except the one place that matters and fails hours into a run with nothing saved.
  # The same rule the shared code repo's URL follows (agents/coordinator/setup.md step 3). Find
  # it with `ip -4 addr show` (the main interface, not lo/docker0/br-*/tailscale0/cni0). The LAN
  # address is reachable from the control-plane containers too, so this one value serves both.
  # Loaded config rejects a loopback endpoint rather than letting it through.
  endpoint: http://REPLACE-WITH-HOST-LAN-IP:9000
  region: us-east-1
  bucket: hypothesisloop-data
  access_key_id: hypothesisloop
  secret_access_key: hypothesisloop

  # How many bytes one agent may hold within one platform experiment. Checked at admission
  # against what the store reports right now, never mid-write: enforcing a ceiling mid-write
  # needs a gateway in the data path, and a job killed as it saves loses the run it was about to
  # preserve. 0 = unlimited.
  max_bytes_per_agent: 214748364800

  # How long a job's scoped credentials stay valid. Each job is handed an STS session that may
  # write only its own prefix and read only its platform experiment's, so no agent can overwrite
  # another's evidence whatever code it runs. Size this above the longest job the stage ladder
  # allows: a job that outlives its session loses write access mid-run and cannot save what it
  # produced. Between 900 and 43200.
  session_duration_seconds: 43200


# Accelerator types — priced hardware.
#
# A type is named by a fact its own driver publishes, written as a fully-qualified "key=value":
#
#   nvidia.com/gpu.product=NVIDIA-H100-80GB-HBM3   NVIDIA GPU Feature Discovery node label
#   amd.com/gpu.product-name=Instinct-MI300X       AMD node labeller node label
#   tenstorrent.com/chipArch=blackhole             Tenstorrent DRA device attribute
#
# These strings are NOT defined here. The driver emits them; this file only attaches a price.
# The same string is what an agent writes as job.accelerator_type, what /resource-catalog/capacity
# reports, what quota bills, and what is labelled on the job's pods — there is no mapping table
# anywhere, because a mapping is a place where two names can disagree.
#
# To see what a cluster actually publishes, read /resource-catalog/capacity: anything listed
# there is a valid name; adding an entry below is what makes it billable (and therefore
# submittable). Any vendor, any model, any granularity you care to price — nothing in the code
# is a closed enum. A device is reported under every fact true of it, so pick the granularity
# you want to bill at: pricing tenstorrent.com/chipArch=blackhole bills every Blackhole board
# alike, while tenstorrent.com/boardType=7 would price one board model.
#
# acch_rate is cost in accelerator-hours (AccH), H100-equivalent (H100 = 1.0).
#
# Accelerators are the resource dimension admitted/preempted on. RAM/storage are hard
# physical-fit-checked at admission instead of hours-quota-tracked. Agents declare accelerator
# count as a plain integer in job.yaml's accelerator_count, never a k8s resource string.

accelerator_types:
  - name:      nvidia.com/gpu.product=Tesla-T4
    acch_rate: 0.125

  - name:      nvidia.com/gpu.product=NVIDIA-L40
    acch_rate: 0.25

  - name:      nvidia.com/gpu.product=NVIDIA-A100-80GB-PCIe
    acch_rate: 0.375

  - name:      nvidia.com/gpu.product=NVIDIA-H100-80GB-HBM3
    acch_rate: 1.0

  - name:      nvidia.com/gpu.product=NVIDIA-H200
    acch_rate: 1.25

  - name:      nvidia.com/gpu.product=NVIDIA-GEFORCE-RTX-4070-TI
    acch_rate: 0.1

  - name:      nvidia.com/gpu.product=NVIDIA-GeForce-RTX-4090
    acch_rate: 0.15

  - name:      nvidia.com/gpu.product=NVIDIA-GEFORCE-GTX-1070-TI
    acch_rate: 0.05

  # Add a rate when jobs may request another accelerator type.
  # - name:      amd.com/gpu.product-name=Instinct-MI300X
  #   acch_rate: 1.125

  - name:      tenstorrent.com/chipArch=blackhole
    acch_rate: 0.5

# Quota & scheduling constants

quota:
  # Fraction of base_share added as a bonus for top-3 placement in any prior experiment.
  top3_bonus_fraction: 0.25

  # burst_quota = guaranteed_quota * burst_fraction (2× overcommit, best-effort).
  burst_fraction: 2.0

  # Maximum number of experiments an agent may submit per hour within a single platform
  # experiment. Prevents queue flooding. 0 = unlimited.
  max_submissions_per_hour: 100

  # Per-job maximum caps — checked at admission, before any quota debit, so one absurd
  # submission can never consume an entire guaranteed/burst budget in a single shot. This is
  # independent of (and on top of) budget sizing: size these relative to your smallest
  # expected burst pool, not just to "a sane job." 0 = unlimited.
  max_accelerator_count_per_job: 16
  max_cpu_cores_per_job: 64
  max_ram_gb_per_job: 512
  max_storage_gb_per_job: 1000



# Scheduler & controller timing

scheduler:
  # How often the admission loop ticks (picks up queued experiments).
  loop_heartbeat_seconds: 10

  # Pod shutdown grace period: default when a job doesn't request its own, and the cap on
  # whatever a job does request.
  default_termination_grace_period_seconds: 5
  max_termination_grace_period_seconds: 30

  # The cap on job.checkpoint_grace_seconds: how long a job may be given, after it is told a
  # policy-class termination (preemption, a stage cut, quota exhaustion, the duration cap) is
  # coming, to write a checkpoint it can resume from. Separate from the shutdown grace above
  # because 30s does not checkpoint a serious model -- and capped, because a job must not hold
  # contended accelerators indefinitely by claiming it is still saving.
  max_checkpoint_grace_seconds: 600

  # One line of a job's reported log tail is split (never truncated/dropped) above this many
  # characters -- large enough to keep a real compiler error or stack frame intact, small enough
  # that one pathological line can't blow up a single status push.
  max_log_tail_line_chars: 2000

  # How often the JobWatcher polls a running k8s Job for phase transitions.
  job_poll_interval_seconds: 5

  # How long a job may stay SUBMITTED/ADMITTED without reporting RUNNING before job_watcher
  # evicts it (reason stuck_pending) and fully refunds its reservation. Bounds capacity held by
  # jobs that never actually start (e.g. unschedulable).
  stuck_pending_timeout_seconds: 300

  # How stale a cluster-agent's heartbeat may be before the cluster is treated as Unreachable:
  # its live-reported capacity ages out of admission (freezing new jobs to it) and it shows
  # Disconnected in the UI. Jobs already RUNNING there are left alone until it reconnects.
  # ~15 missed polls at the ~2s desired-state cadence.
  cluster_unreachable_after_seconds: 30

  # How long a cluster may push no job-status snapshot at all before the jobs it still holds are
  # evicted as cluster_unreachable and their reservations released. Far longer than
  # cluster_unreachable_after_seconds above, which only freezes admission to the cluster: this
  # one ends real work, so it must comfortably outlast a control-plane restart, a rolling
  # cluster-agent upgrade, and a transient network partition.
  cluster_status_silence_ceiling_seconds: 900

  # How many times one experiment may go back to the queue for free after an infrastructure
  # fault (cluster_unreachable, workload_gone, stuck_pending, flavor_mismatch,
  # accelerator_type_unobservable). Those attempts cost no max_retries budget and no
  # accelerator-hours -- the environment failed the job, not the agent. Past this ceiling the
  # job stops and stays EVICTED with the reason that kept ending it.
  max_infrastructure_requeues: 3

  # Age-bucket width for guaranteed-tier admission fairness: jobs queued within this window of
  # each other are ordered by least-used-quota agent first instead of exact FIFO timestamp,
  # bounding how far a steady-submitting agent's own jobs can jump ahead of other agents'
  # equally-entitled jobs.
  guaranteed_fairness_window_seconds: 60

  # Evict a RUNNING job whose CPU/memory/storage request exceeds this multiple of its
  # proportionate per-accelerator share of the cluster, while that request is provably the only
  # thing keeping a queued job off idle accelerators on the same node. Guards against a job
  # taking one of a node's four accelerators and all of its cores, stranding the other three.
  # Required and positive — there is no off switch: a disabled pass is a second scheduling
  # behaviour to reason about, and stranded accelerators are stranded whether or not an operator
  # switched the fix on. 3 is the suggested value — a job is entitled to its proportionate share,
  # and three times that is already past any plausible host-side need.
  resource_disbalance_tolerance: 3

  # How often the metric controller reconciles running experiments.
  reconcile_interval_seconds: 5

  # Default silence cadence when a platform experiment does not define one.
  default_report_interval_seconds: 30

  # Multiplier on report_interval_seconds; no metric push for this many intervals triggers eviction.
  silence_multiplier: 3.0

  # Floor on the silence window (silence_multiplier * report_interval_seconds), regardless of
  # how short a platform experiment's own report_interval_seconds is configured. Must comfortably
  # exceed realistic node-death -> reschedule -> pod-running-again recovery time, or a fast
  # reporting cadence turns a normal self-heal into a false permanent eviction.
  min_silence_window_seconds: 300

  # Kubernetes Job retries (RestartPolicy=OnFailure) before k8s marks the Job Failed.
  # Absorbs transient pod flakes; a persistently crashing job exhausts these retries and is
  # failed natively by k8s (job watcher then records FAILED and refunds unused AccH).


# Stages — the elimination ladder
#
# An ordered list of stages:
#   length_pct     share of the experiment this stage spans; all stages must sum to 100
#   evict_pct      share of *surviving* agents cut when the stage ends; 0 cuts nobody
#   max_job_hours  longest a single job may run while this stage is current; 0 (the default,
#                  and what you get by omitting it) is unlimited. Enforced twice: a submission
#                  estimating more is rejected job_too_long, and a job that outruns the cap is
#                  evicted job_too_long against its observed runtime. A short cap on the first
#                  stage buys many small exploratory runs; leave it off later so validated
#                  ideas can run long.
#
# Progress across the ladder is max(budget_consumed / total_budget, elapsed / duration), so
# whichever runs out first advances it. The final stage must have evict_pct 0 — nothing
# follows it. Fixed at creation per platform experiment; this is only the default applied to
# a platform experiment created without its own ladder.
#
#   [{length_pct: 100, evict_pct: 0}]                       one stage, no cuts
#   [{20,25}, {30,25}, {50,0}]                              three stages, a quarter cut twice
#   [{length_pct: 30, evict_pct: 25, max_job_hours: 1},     explore in <=1h runs, then no limit
#    {length_pct: 70, evict_pct: 0}]

stages:
  default:
    - length_pct: 40
      evict_pct: 75
    - length_pct: 60
      evict_pct: 0
