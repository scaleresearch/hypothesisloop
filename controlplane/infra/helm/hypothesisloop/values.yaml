# Default values for the hypothesisloop chart.
#
# Platform policy (accelerator prices, quota, stage ladder, scheduler timing) is not repeated
# here. It lives in controlplane/settings/hypothesisloop.yaml, which `make helm-prepare` stages
# into files/hypothesisloop.yaml and templates/config.yaml renders into the ConfigMap. This file
# holds what differs per deployment: images, addresses, sizes, and which stores run in-cluster.

namespace:
  create: true
  name: hypothesisloop

images:
  # The registry `make images REGISTRY=...` pushed to. Required: every node must be able to pull
  # from it, and no address is a safe guess.
  registry: ""
  pullPolicy: IfNotPresent
  # The TAG `make images` printed. Required. It names the tree content that was built, so
  # IfNotPresent never runs stale bytes under a reused tag.
  tag: ""

# Every secret comes from this one Secret, which must exist in the namespace before the chart is
# installed. The chart reads it and never creates it. Keys:
#
#   DATABASE_URL                     Postgres connection string. With postgres.enabled it is
#                                    postgres://<postgres.user>:<POSTGRES_PASSWORD>@hypothesisloop-postgres:5432/<postgres.database>?sslmode=disable
#   POSTGRES_PASSWORD                only with postgres.enabled
#   OBJECT_STORE_ACCESS_KEY_ID       object store key that may create service accounts; with
#   OBJECT_STORE_SECRET_ACCESS_KEY   objectStore.enabled these become the store's root user
#
# plus whatever config.secretEnv, cloudAgent.secretEnv and agentLauncher.secretEnv name.
secretName: hypothesisloop

# Set to any string that changes when the Secret's content does (a hash of it). It is stamped on
# every pod that reads the Secret, so a changed secret restarts them.
secretChecksum: ""

config:
  # Appended verbatim to hypothesisloop.yaml: the sections a deployment adds to the staged file.
  # Write ${NAME} for a secret and list NAME in secretEnv; the services expand it at start.
  extra: ""
  # Secret keys handed as environment variables to control-service and metrics-service, the two
  # processes that load hypothesisloop.yaml. Every ${NAME} in the rendered file must be here.
  secretEnv:
    - DATABASE_URL
    - OBJECT_STORE_ACCESS_KEY_ID
    - OBJECT_STORE_SECRET_ACCESS_KEY

postgres:
  # false when DATABASE_URL in the Secret points at a database run elsewhere.
  enabled: true
  image: postgres:16-alpine
  user: hypothesisloop
  database: hypothesisloop
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

greptimedb:
  image: greptime/greptimedb:latest
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # A metrics store run elsewhere instead of the StatefulSet: its http URL.
  external:
    enabled: false
    url: ""

# The hypothesis graph, read and written only by control-service. One shared instance. Pinned: the
# schema bootstrap and the read-only query guard (controlplane/shared/graphdb) were verified
# against exactly this version.
memgraph:
  image: memgraph/memgraph:3.13.1
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }
  # An existing Memgraph instead of the StatefulSet: its bolt URL, e.g. bolt://memgraph.example:7687.
  external:
    enabled: false
    url: ""

# Durable-data object store (S3 plus the MinIO admin API, which creates each job's key).
objectStore:
  # Deploys Silo and creates the bucket named in hypothesisloop.yaml. false when endpoint names
  # a store run elsewhere.
  enabled: true
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  # data_store.endpoint: the one address both the control plane and every job reach the store at.
  # Required. Jobs in this cluster only: http://object-store.<namespace>.svc:9000. Jobs on other
  # clusters or rented hosts: an address they can reach, such as a tunnel URL to the NodePort.
  endpoint: ""
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  service:
    type: NodePort
    nodePort: 30900

controlService:
  replicas: 1
  port: 8081
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: NodePort
    nodePort: 30081

metricsService:
  replicas: 1
  port: 8084
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: NodePort
    nodePort: 30084

# The API address the browser calls is compiled into the UI image (NEXT_PUBLIC_API_URL, see
# controlplane/build/Dockerfile.ui), so it is set when the image is built.
ui:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  service:
    type: NodePort
    nodePort: 30300

# One process per compute provider account; it registers as a cluster and holds that provider's
# key. Image hypothesisloop-cloud-agent, its one config file from `config` (verbatim, mounted at
# /settings/cloud-agent.yaml, path in CLOUD_AGENT_CONFIG), secrets from secretEnv.
cloudAgent:
  enabled: false
  config: ""
  secretEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# One process per sandbox provider account; it creates and destroys agent VMs. Image
# hypothesisloop-agent-launcher, config at /settings/agent-launcher.yaml (path in
# AGENT_LAUNCHER_CONFIG), secrets from secretEnv.
agentLauncher:
  enabled: false
  config: ""
  secretEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
