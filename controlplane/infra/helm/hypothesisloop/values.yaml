# Default values for the hypothesisloop chart.
#
# Platform policy (accelerator prices, quota, stage ladder, scheduler timing) is not repeated
# here. It lives in controlplane/settings/hypothesisloop.yaml, which `make helm-prepare` stages
# into files/hypothesisloop.yaml and templates/config.yaml renders into the ConfigMap. This file
# holds what differs per deployment: images, addresses, sizes, and which stores run in-cluster.

namespace:
  create: true
  name: hypothesisloop

images:
  # The registry `make images REGISTRY=...` pushed to. Required: every node must be able to pull
  # from it, and no address is a safe guess.
  registry: ""
  pullPolicy: IfNotPresent
  # The TAG `make images` printed. Required. It names the tree content that was built, so
  # IfNotPresent never runs stale bytes under a reused tag.
  tag: ""

# Every secret comes from this one Secret, which must exist in the namespace before the chart is
# installed. The chart reads it and never creates it. Required. Its keys:
#
#   DATABASE_URL                     Postgres connection string. With postgres.enabled it is
#                                    postgres://<postgres.user>:<POSTGRES_PASSWORD>@hypothesisloop-postgres:5432/<postgres.database>?sslmode=disable
#   POSTGRES_PASSWORD                only with postgres.enabled
#   HYPOTHESISLOOP_SIGNING_SECRET    derives every token the platform hands out, 32 characters or
#                                    more. Whoever holds it can mint a staff token.
#   OBJECT_STORE_ACCESS_KEY_ID       object store key that may create service accounts; with
#   OBJECT_STORE_SECRET_ACCESS_KEY   objectStore.enabled these become the store's root user
#   HYPOTHESISLOOP_GITHUB_APP_CLIENT_SECRET   only with github.appId: the App's OAuth client
#   HYPOTHESISLOOP_GITHUB_APP_PRIVATE_KEY     secret and the PEM GitHub issued for it
#
# plus whatever cloudAgent.secretEnv and agentLauncher.secretEnv name.
secretName: ""

# Set to any string that changes when the Secret's content does (a hash of it). It is stamped on
# every pod that reads the Secret, so a changed secret restarts them.
secretChecksum: ""

# Read by no template. An installer that hands helm this chart as a local path sets it to a hash
# of the chart's files, so that an edited template makes a changed release.
chartChecksum: ""

# Who may call the API: the auth section of hypothesisloop.yaml, which explains each value. The
# signing secret is not here. It comes from the Secret.
auth:
  # The identity providers people sign in with, written as they are into auth.identity_providers
  # of hypothesisloop.yaml, so each entry has that file's keys: issuer, audience and jwt_keys. A
  # deployment lists the one it uses. With none listed no person's token is accepted and the API
  # takes API keys and derived tokens only.
  # jwt_keys are the provider's public keys as its JWKS document lists them, with these fields
  # only: kid, kty, alg and crv, x, y (ES256) or n, e (RS256). In a values file write "y" and "n"
  # in quotes: helm reads a bare y or n as a boolean.
  identityProviders: []
  # Required: the address people open the UI at.
  uiOrigin: ""

# The GitHub App a project's repository is reached through: the github section of
# hypothesisloop.yaml, which explains each value. With appId 0 the deployment has no App and the
# section is left out. Its two secrets come from the Secret.
github:
  appId: 0
  appSlug: ""
  clientId: ""

# Hosted agents: the agents section of hypothesisloop.yaml.
agents:
  # The launcher_name of the agent-launcher that starts them.
  launcher: main
  # Required: the image a hosted agent's machine boots, pullable from wherever the launcher rents.
  image: ""
  # Required: the address a hosted agent reaches the API at.
  apiURL: ""

# Where a cluster's runtime reaches the platform: the runtimes section of hypothesisloop.yaml.
# Both are handed out when a cluster is registered and must be reachable from inside every
# cluster that runs jobs. The section's registry and image_tag are images.registry and
# images.tag above: a cluster's runtime installs the images this release runs.
runtimes:
  # Required: this API.
  apiURL: ""
  # Required: metrics-service.
  metricsURL: ""

postgres:
  # false when DATABASE_URL in the Secret points at a database run elsewhere.
  enabled: true
  image: postgres:16-alpine
  user: hypothesisloop
  database: hypothesisloop
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

greptimedb:
  image: greptime/greptimedb:latest
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # A metrics store run elsewhere instead of the StatefulSet: its http URL.
  external:
    enabled: false
    url: ""

# The hypothesis graph, read and written only by control-service. One shared instance. Pinned: the
# schema bootstrap and the read-only query guard (controlplane/shared/graphdb) were verified
# against exactly this version.
memgraph:
  image: memgraph/memgraph:3.13.1
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }
  # An existing Memgraph instead of the StatefulSet: its bolt URL, e.g. bolt://memgraph.example:7687.
  external:
    enabled: false
    url: ""

# Durable-data object store (S3 plus the MinIO admin API, which creates each job's key).
objectStore:
  # Deploys Silo and creates the bucket named in hypothesisloop.yaml. false when endpoint names
  # a store run elsewhere.
  enabled: true
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  # data_store.endpoint: the one address both the control plane and every job reach the store at.
  # Required. Jobs in this cluster only: http://object-store.<namespace>.svc:9000. Jobs on other
  # clusters or rented hosts: an address they can reach, such as a tunnel URL to the NodePort.
  endpoint: ""
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  service:
    type: NodePort
    nodePort: 30900

controlService:
  replicas: 1
  port: 8081
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: NodePort
    nodePort: 30081

metricsService:
  replicas: 1
  port: 8084
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: NodePort
    nodePort: 30084

# Image hypothesisloop-ui. Next.js compiles NEXT_PUBLIC_* values into the image when it is built
# (controlplane/build/Dockerfile.ui): the API address and the two Supabase values. The Deployment
# sets the two Supabase values as environment too, and they must be the ones the image was built
# with.
ui:
  enabled: true
  # Required with enabled: https://<project>.supabase.co and the project's publishable key. Both
  # are public values.
  supabaseURL: ""
  supabasePublishableKey: ""
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  service:
    type: NodePort
    nodePort: 30300

# One process per compute provider account; it registers as a cluster and holds that provider's
# key. Image hypothesisloop-cloud-agent.
cloudAgent:
  enabled: false
  # Required with enabled: the whole config file, as runtime/cloud/settings/cloud-agent.yaml
  # describes it. It is mounted as it is, so it holds the names of environment variables and
  # never a secret.
  config: ""
  # Required with enabled: the config's cluster_name and the org the cluster belongs to. The pod
  # registers the cluster for that org at every start and takes its runtime token from the
  # control plane's own tool, so no one carries a token into the Secret. shared places every
  # org's jobs on the cluster, and false only its own org's.
  clusterName: ""
  org: ""
  shared: false
  # Secret keys handed to the process as environment variables of the same name: every variable
  # the config names, such as the provider's api_key_env.
  secretEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# One process per sandbox provider account; it creates and destroys the machines hosted agents
# run in. Image hypothesisloop-agent-launcher.
agentLauncher:
  enabled: false
  # Required with enabled: the whole config file, as runtime/cloud/settings/agent-launcher.yaml
  # describes it. Its launcher_name must be agents.launcher above.
  config: ""
  # Secret keys handed to the process as environment variables of the same name: the variables
  # model_provider.env names and the provider's. The pod takes its own token for
  # agents.launcher from the control plane's tool at every start.
  secretEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
