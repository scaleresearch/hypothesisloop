# Default values for the hypothesisloop chart.
#
# Platform policy (accelerator prices, quota, stage ladder, scheduler timing) is not repeated
# here. It lives in controlplane/settings/hypothesisloop.yaml, which `make helm-prepare` stages
# into files/hypothesisloop.yaml and templates/config.yaml renders into the ConfigMap. This file
# holds what differs per deployment: images, addresses, sizes, and which stores run in-cluster.

namespace:
  create: true
  name: hypothesisloop

images:
  # The registry `make images REGISTRY=...` pushed to. Required: every node must be able to pull
  # from it, and no address is a safe guess.
  registry: ""
  pullPolicy: IfNotPresent
  # The TAG `make images` printed. Required. It names the tree content that was built, so
  # IfNotPresent never runs stale bytes under a reused tag.
  tag: ""

# Every secret comes from this one Secret, which must exist in the namespace before the chart is
# installed. The chart reads it and never creates it. Required. Its keys:
#
#   DATABASE_URL                     Postgres connection string. With postgres.enabled it is
#                                    postgres://<postgres.user>:<POSTGRES_PASSWORD>@hypothesisloop-postgres:5432/<postgres.database>?sslmode=disable
#   POSTGRES_PASSWORD                only with postgres.enabled
#   HYPOTHESISLOOP_SIGNING_SECRET    derives every token the platform hands out, 32 characters or
#                                    more. Whoever holds it can mint a staff token.
#   MODEL_ANTHROPIC_OAUTH_TOKEN      the Claude subscription token control-service makes every
#                                    hosted agent's model calls with (models in
#                                    hypothesisloop.yaml). No agent's machine is given it.
#   OBJECT_STORE_ACCESS_KEY_ID       object store key that may create service accounts; with
#   OBJECT_STORE_SECRET_ACCESS_KEY   objectStore.enabled these become the store's root user
#   HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_PRIVATE_KEY     only with gitHost.provider github: the PEM
#                                                      GitHub issued for the App
#   HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD   only with gitHost.plain.username: that account's password
#   ENVIRONMENTS_GCP_CREDENTIALS     only with environments.provider gcp: control-service's own
#                                    Google identity, as an application default credentials file
#                                    (a service account key or a workload identity federation
#                                    config), which may mint the tokens of environments.gcp.pusher
#                                    and environments.gcp.puller
#
# plus whatever providerSecretEnv names.
secretName: ""

# Set to any string that changes when the Secret's content does (a hash of it). It is stamped on
# every pod that reads the Secret, so a changed secret restarts them.
secretChecksum: ""

# Read by no template. An installer that hands helm this chart as a local path sets it to a hash
# of the chart's files, so that an edited template makes a changed release.
chartChecksum: ""

# Who may call the API: the auth section of hypothesisloop.yaml, which explains each value. The
# signing secret is not here. It comes from the Secret.
auth:
  # The identity providers people sign in with, written as they are into auth.identity_providers
  # of hypothesisloop.yaml, so each entry has that file's keys: issuer, audience and jwt_keys. A
  # deployment lists the one it uses. With none listed no person's token is accepted and the API
  # takes API keys and derived tokens only.
  # jwt_keys are the provider's public keys as its JWKS document lists them, with these fields
  # only: kid, kty, alg and crv, x, y (ES256) or n, e (RS256). In a values file write "y" and "n"
  # in quotes: helm reads a bare y or n as a boolean.
  identityProviders: []
  # Required: the address people open the UI at.
  uiOrigin: ""

# The git host platform experiments keep their code on: the git_host section of
# hypothesisloop.yaml, which explains each value. Required: provider is github or plain, and only
# the section of that name is read.
gitHost:
  # Required: the address agents and jobs reach the API's /git at, the git proxy they clone and
  # push through with their own token. publicAPIURL with /git after it, unless something in front
  # of the API serves it elsewhere.
  proxyURL: ""
  provider: ""
  # The GitHub App a project's repository is reached through. Its private key comes from the Secret.
  github:
    appId: 0
    appSlug: ""
  # Any git host that serves repositories under one root.
  plain:
    # The https root repositories are cloned from.
    baseURL: ""
    # true lets baseURL be http, for a host on the deployment's own network.
    allowHTTP: false
    # The account the platform and every agent reach the host as. Its password is the Secret's
    # HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD. Left empty for a host that asks for no credential.
    username: ""

# Where environment images are pushed and the registry provider whose logins control-service hands
# out for them: the environments section of hypothesisloop.yaml, which explains each value. With
# repository empty the deployment builds no environments. With it set, provider is required, and
# so is that provider's section:
#   gcp  Google Artifact Registry: the two service accounts, pusher and puller, and the Secret's
#        ENVIRONMENTS_GCP_CREDENTIALS, which mints their tokens.
environments:
  repository: ""
  provider: ""
  gcp:
    pusher: ""
    puller: ""

# Required: the one address this API is reached at from outside the control plane, by hosted
# agents and by every cluster's runtime. services.public_api_url of hypothesisloop.yaml.
publicAPIURL: ""

# Hosted agents: the agents section of hypothesisloop.yaml.
agents:
  # Required: the image a hosted agent's machine boots, pullable from the sandbox provider.
  image: ""

# Where a cluster's runtime sends metrics: the runtimes section of hypothesisloop.yaml. It is
# handed out when a cluster is registered and must be reachable from inside every cluster that
# runs jobs. The section's registry and image_tag are images.registry and images.tag above: a
# cluster's runtime installs the images this release runs.
runtimes:
  # Required: metrics-service.
  metricsURL: ""

postgres:
  # false when DATABASE_URL in the Secret points at a database run elsewhere.
  enabled: true
  image: postgres:16-alpine
  user: hypothesisloop
  database: hypothesisloop
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

greptimedb:
  image: greptime/greptimedb:v1.2.1
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # A metrics store run elsewhere instead of the StatefulSet: its http URL.
  external:
    enabled: false
    url: ""

# The hypothesis graph, read and written only by control-service. One shared instance. Pinned: the
# schema bootstrap and the read-only query guard (controlplane/storage/graphdb) were verified
# against exactly this version.
memgraph:
  image: memgraph/memgraph:3.13.1
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }
  # An existing Memgraph instead of the StatefulSet: its bolt URL, e.g. bolt://memgraph.example:7687.
  external:
    enabled: false
    url: ""

# Durable-data object store: the data_store section of hypothesisloop.yaml.
objectStore:
  # How the store creates each job's key, data_store.provider: minio, the MinIO admin API, which
  # the in-cluster store below speaks.
  provider: minio
  # Deploys Silo and creates the bucket named in hypothesisloop.yaml. false when endpoint names
  # a store run elsewhere.
  enabled: true
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  # data_store.endpoint: the address every job and agent is handed to reach the store at.
  # Required. Jobs in this cluster only: http://object-store.<namespace>.svc:9000. Jobs on other
  # clusters or rented hosts: an address they can reach, such as a tunnel URL to the NodePort.
  endpoint: ""
  # data_store.control_plane_endpoint: where the control plane itself reaches the store. With
  # enabled it is the chart's own Service and this stays empty. With a store run elsewhere it is
  # required: that store's address on the control plane's network.
  controlPlaneEndpoint: ""
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  service:
    type: ClusterIP
    nodePort: 30900

controlService:
  replicas: 1
  port: 8081
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: ClusterIP
    nodePort: 30081

metricsService:
  replicas: 1
  port: 8084
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: ClusterIP
    nodePort: 30084

# Image hypothesisloop-ui. Next.js compiles NEXT_PUBLIC_* values into the image when it is built
# (controlplane/build/Dockerfile.ui): the API address and the sign-in service. The Deployment sets
# the sign-in service's values as environment too, and they must be the ones the image was built
# with.
ui:
  enabled: true
  # Required with enabled: the service that signs people in, and that provider's section. All are
  # public values.
  #   supabase  a Supabase project: url, https://<project>.supabase.co, and its publishableKey.
  identity:
    provider: ""
    supabase:
      url: ""
      publishableKey: ""
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  service:
    type: ClusterIP
    nodePort: 30300

# Machines control-service rents itself: the sandbox and cloud_compute sections of
# hypothesisloop.yaml, written as those sections are, which controlplane/settings/sandbox.yaml
# and cloud-compute.yaml describe. They hold the names of environment variables and never a
# secret. Without a sandbox nothing is hosted. Each cloud_compute entry is a cluster registered
# as any other (hl-admin cluster add, run in the control-service pod), and nothing is rented for
# it until it is.
sandbox: {}
cloudCompute: []
# Secret keys handed to control-service as environment variables of the same name: every variable
# the provider settings above name, such as FLY_API_TOKEN or VAST_API_KEY.
providerSecretEnv: []
