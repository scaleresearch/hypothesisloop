{{- $raw := include "hypothesisloop.stagedConfig" . }}
{{- $endpoint := required "objectStore.endpoint is required: the address the control plane and every job reach the object store at" .Values.objectStore.endpoint }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "key" "  endpoint" "value" $endpoint) }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "key" "  access_key_id" "value" "${OBJECT_STORE_ACCESS_KEY_ID}") }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "key" "  secret_access_key" "value" "${OBJECT_STORE_SECRET_ACCESS_KEY}") }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "key" "  metrics_db_url" "value" (include "hypothesisloop.metricsDBURL" .)) }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "key" "  graph_db_url" "value" (include "hypothesisloop.graphDBURL" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypothesisloop-config
  namespace: {{ include "hypothesisloop.namespace" . }}
data:
  hypothesisloop.yaml: |
{{ $raw | indent 4 }}
{{- with .Values.config.extra }}
{{ . | indent 4 }}
{{- end }}
