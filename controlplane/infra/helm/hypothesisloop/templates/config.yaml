{{- /*
The staged hypothesisloop.yaml with what differs per deployment set from values. A secret is
written as ${NAME}: both services replace it from their environment, which the Secret fills.
*/ -}}
{{- $raw := include "hypothesisloop.stagedConfig" . }}
{{- $set := list
  (list "services" "metrics_db_url" (include "hypothesisloop.metricsDBURL" .))
  (list "services" "graph_db_url" (include "hypothesisloop.graphDBURL" .))
  (list "services" "public_api_url" (required "publicAPIURL is required: the address hosted agents and every cluster's runtime reach the API at" .Values.publicAPIURL))
  (list "auth" "identity_providers" .Values.auth.identityProviders)
  (list "auth" "signing_secret" "${HYPOTHESISLOOP_SIGNING_SECRET}")
  (list "auth" "ui_origin" (required "auth.uiOrigin is required: the one browser origin allowed to call the API, which is the address people open the UI at" .Values.auth.uiOrigin))
  (list "agents" "launcher" (required "agents.launcher is required: the launcher a newly hosted agent is given to" .Values.agents.launcher))
  (list "agents" "image" (required "agents.image is required: the image a hosted agent's machine boots" .Values.agents.image))
  (list "runtimes" "metrics_url" (required "runtimes.metricsURL is required: the address a cluster's runtime reaches metrics-service at" .Values.runtimes.metricsURL))
  (list "runtimes" "registry" (required "images.registry is required: pass the REGISTRY `make images` pushed to" .Values.images.registry))
  (list "runtimes" "image_tag" (required "images.tag is required: pass the TAG `make images` built" .Values.images.tag))
  (list "data_store" "endpoint" (required "objectStore.endpoint is required: the address every job and agent is handed to reach the object store at" .Values.objectStore.endpoint))
  (list "data_store" "control_plane_endpoint" (include "hypothesisloop.objectStoreControlPlaneEndpoint" .))
  (list "data_store" "access_key_id" "${OBJECT_STORE_ACCESS_KEY_ID}")
  (list "data_store" "secret_access_key" "${OBJECT_STORE_SECRET_ACCESS_KEY}")
}}
{{- range $set }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "section" (index . 0) "key" (index . 1) "value" (index . 2)) }}
{{- end }}
{{- /*
The staged file names no git host: the chart adds the GitHub App of a deployment that has one,
and otherwise the plain host the values name.
*/ -}}
{{- if regexMatch "(?m)^(github|git):" $raw }}
{{- fail "files/hypothesisloop.yaml has a github or git section, and the chart would add a second one" }}
{{- end }}
{{- if .Values.github.appId }}
{{- if or .Values.git.baseURL .Values.git.allowHTTP .Values.git.username }}
{{- fail "github.appId and git are set together: a deployment keeps its code on one git host" }}
{{- end }}
{{- $raw = printf "%s\ngithub:\n  app_id: %s\n  app_slug: %s\n  client_id: %s\n  client_secret: %s\n  private_key: %s\ngit:\n  provider: github\n" (trimSuffix "\n" $raw)
  (toJson (int64 .Values.github.appId))
  (toJson (required "github.appSlug is required with github.appId: the name in the App's URL" .Values.github.appSlug))
  (toJson (required "github.clientId is required with github.appId: the App's OAuth client id" .Values.github.clientId))
  (toJson "${HYPOTHESISLOOP_GITHUB_APP_CLIENT_SECRET}")
  (toJson "${HYPOTHESISLOOP_GITHUB_APP_PRIVATE_KEY}") }}
{{- else }}
{{- $raw = printf "%s\ngit:\n  provider: plain\n  base_url: %s\n  allow_http: %s\n" (trimSuffix "\n" $raw)
  (toJson (required "git.baseURL is required without github.appId: the root the deployment's repositories are cloned from" .Values.git.baseURL))
  (toJson .Values.git.allowHTTP) }}
{{- if .Values.git.username }}
{{- $raw = printf "%s  username: %s\n  password: %s\n" $raw (toJson .Values.git.username) (toJson "${HYPOTHESISLOOP_GIT_PASSWORD}") }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypothesisloop-config
  namespace: {{ include "hypothesisloop.namespace" . }}
data:
  hypothesisloop.yaml: |
{{ $raw | indent 4 }}
