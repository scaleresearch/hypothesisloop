apiVersion: v1
kind: Service
metadata:
  name: control-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  type: {{ .Values.controlService.service.type }}
  selector:
    app: hypothesisloop-control-service
  ports:
    - port: {{ .Values.controlService.port }}
      targetPort: {{ .Values.controlService.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-control-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  replicas: {{ .Values.controlService.replicas }}
  selector:
    matchLabels:
      app: hypothesisloop-control-service
  template:
    metadata:
      labels:
        app: hypothesisloop-control-service
    spec:
      {{- if not .Values.postgres.external.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h hypothesisloop-postgres -U {{ .Values.postgres.user }}; do sleep 2; done"]
      {{- end }}
      containers:
        - name: control-service
          image: {{ include "hypothesisloop.image" (dict "name" "control-service" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: API_PORT
              value: {{ .Values.controlService.port | quote }}
            - name: HYPOTHESISLOOP_CONFIG
              value: /settings/hypothesisloop.yaml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hypothesisloop.databaseSecretName" . }}
                  key: {{ include "hypothesisloop.databaseSecretKey" . }}
          ports:
            - containerPort: {{ .Values.controlService.port }}
          volumeMounts:
            - name: config
              mountPath: /settings
              readOnly: true
          resources:
            {{- toYaml .Values.controlService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.controlService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: hypothesisloop-config
