apiVersion: v1
kind: Service
metadata:
  name: control-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  type: {{ .Values.controlService.service.type }}
  selector:
    app: hypothesisloop-control-service
  ports:
    - port: {{ .Values.controlService.port }}
      targetPort: {{ .Values.controlService.port }}
      {{- if eq .Values.controlService.service.type "NodePort" }}
      nodePort: {{ .Values.controlService.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-control-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  replicas: {{ .Values.controlService.replicas }}
  selector:
    matchLabels:
      app: hypothesisloop-control-service
  template:
    metadata:
      labels:
        app: hypothesisloop-control-service
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- include "hypothesisloop.secretAnnotations" . | nindent 8 }}
    spec:
      {{- if or .Values.postgres.enabled (not .Values.memgraph.external.enabled) }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h hypothesisloop-postgres -U {{ .Values.postgres.user }}; do sleep 2; done"]
        {{- end }}
        {{- if not .Values.memgraph.external.enabled }}
        - name: wait-for-memgraph
          image: {{ .Values.memgraph.image }}
          command: ["sh", "-c", "until echo 'RETURN 1;' | mgconsole --host memgraph >/dev/null 2>&1; do sleep 2; done"]
        {{- end }}
      {{- end }}
      containers:
        - name: control-service
          image: {{ include "hypothesisloop.image" (dict "name" "control-service" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: API_PORT
              value: {{ .Values.controlService.port | quote }}
            - name: HYPOTHESISLOOP_CONFIG
              value: /settings/hypothesisloop.yaml
            {{- include "hypothesisloop.configSecretEnv" . | nindent 12 }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /credentials/google.json
          ports:
            - containerPort: {{ .Values.controlService.port }}
          volumeMounts:
            - name: config
              mountPath: /settings
              readOnly: true
            # A directory, never subPath, so a renewed Secret reaches the process without a restart.
            - name: credentials
              mountPath: /credentials
              readOnly: true
          resources:
            {{- toYaml .Values.controlService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.controlService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: hypothesisloop-config
        - name: credentials
          secret:
            secretName: {{ include "hypothesisloop.secretName" . }}
            items:
              - { key: GOOGLE_CREDENTIALS, path: google.json }
