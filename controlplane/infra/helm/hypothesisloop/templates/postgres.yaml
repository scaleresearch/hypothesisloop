{{- if not .Values.postgres.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hypothesisloop-postgres
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  selector:
    app: hypothesisloop-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypothesisloop-postgres
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  serviceName: hypothesisloop-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-postgres
  template:
    metadata:
      labels:
        app: hypothesisloop-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
  # No init/schema ConfigMap: Postgres starts genuinely empty (its own docker-entrypoint-initdb.d
  # only ever runs once, against a fresh volume, so wiring the schema there would silently stop
  # applying it the moment this StatefulSet's PVC already exists — exactly the gap that used to
  # leave `helm upgrade` never picking up a new column/table). control-service alone self-applies
  # controlplane/shared/db/schema.sql (baked into its own image only, db.ApplySchema) on every
  # boot instead — the one checked-in copy, applied by the one binary that owns it, not
  # duplicated into this chart or into metrics-service's image (which reads the same tables but
  # never owns their schema).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
