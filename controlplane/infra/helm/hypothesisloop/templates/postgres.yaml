{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hypothesisloop-postgres
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  selector:
    app: hypothesisloop-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypothesisloop-postgres
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  serviceName: hypothesisloop-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-postgres
  template:
    metadata:
      labels:
        app: hypothesisloop-postgres
      annotations:
        {{- include "hypothesisloop.secretAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            {{- include "hypothesisloop.secretEnv" (dict "keys" (list "POSTGRES_PASSWORD") "root" $) | nindent 12 }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
  # No schema is mounted: control-service builds the schema.sql embedded in its binary at start
  # (db.EnsureSchema).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
