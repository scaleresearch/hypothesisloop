{{- if .Values.clusterAgentBundle.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypothesisloop-cluster-agent
  namespace: {{ include "hypothesisloop.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypothesisloop-cluster-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaimtemplates"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypothesisloop-cluster-agent
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-cluster-agent
    namespace: {{ include "hypothesisloop.namespace" . }}
roleRef:
  kind: ClusterRole
  name: hypothesisloop-cluster-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-cluster-agent
  namespace: {{ include "hypothesisloop.namespace" . }}
  labels:
    app: hypothesisloop-cluster-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-cluster-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-cluster-agent
    spec:
      serviceAccountName: hypothesisloop-cluster-agent
      containers:
        - name: cluster-agent
          image: {{ include "hypothesisloop.image" (dict "name" "cluster-agent" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.clusterAgentBundle.clusterName | quote }}
            - name: API_URL
              value: {{ .Values.clusterAgentBundle.apiURL | quote }}
          resources:
            {{- toYaml .Values.clusterAgentBundle.clusterAgent.resources | nindent 12 }}
      tolerations:
        - operator: Exists
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypothesisloop-node-agent
  namespace: {{ include "hypothesisloop.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypothesisloop-node-agent-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypothesisloop-node-agent-pod-reader
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-node-agent
    namespace: {{ include "hypothesisloop.namespace" . }}
roleRef:
  kind: ClusterRole
  name: hypothesisloop-node-agent-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hypothesisloop-node-agent
  namespace: {{ include "hypothesisloop.namespace" . }}
  labels:
    app: hypothesisloop-node-agent
spec:
  selector:
    matchLabels:
      app: hypothesisloop-node-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-node-agent
    spec:
      serviceAccountName: hypothesisloop-node-agent
      hostPID: true
      containers:
        - name: node-agent
          image: {{ include "hypothesisloop.image" (dict "name" "node-agent" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: {{ .Values.clusterAgentBundle.clusterName | quote }}
            - name: HYPOTHESISLOOP_CONTROL_PLANE_URL
              value: {{ .Values.clusterAgentBundle.metricsURL | quote }}
            - name: PUSH_INTERVAL_MS
              value: {{ .Values.clusterAgentBundle.nodeAgent.pushIntervalMs | quote }}
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          resources:
            {{- toYaml .Values.clusterAgentBundle.nodeAgent.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      tolerations:
        - operator: Exists
{{- end }}
