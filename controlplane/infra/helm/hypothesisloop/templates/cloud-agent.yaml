{{- if .Values.cloudAgent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypothesisloop-cloud-agent-config
  namespace: {{ include "hypothesisloop.namespace" . }}
data:
  cloud-agent.yaml: |
{{ required "cloudAgent.config is required when cloudAgent.enabled is true" .Values.cloudAgent.config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-cloud-agent
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  replicas: 1
  # One process per provider account: the old pod is gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hypothesisloop-cloud-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-cloud-agent
      annotations:
        checksum/config: {{ .Values.cloudAgent.config | sha256sum }}
        {{- include "hypothesisloop.secretAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: cloud-agent
          image: {{ include "hypothesisloop.image" (dict "name" "cloud-agent" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: CLOUD_AGENT_CONFIG
              value: /settings/cloud-agent.yaml
            {{- include "hypothesisloop.secretEnv" (dict "keys" .Values.cloudAgent.secretEnv "root" $) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /settings
              readOnly: true
          resources:
            {{- toYaml .Values.cloudAgent.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: hypothesisloop-cloud-agent-config
{{- end }}
