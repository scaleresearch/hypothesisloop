{{- if .Values.cloudAgent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypothesisloop-cloud-agent-config
  namespace: {{ include "hypothesisloop.namespace" . }}
data:
  cloud-agent.yaml: |
{{ required "cloudAgent.config is required when cloudAgent.enabled is true" .Values.cloudAgent.config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-cloud-agent
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  replicas: 1
  # One process per provider account: the old pod is gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hypothesisloop-cloud-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-cloud-agent
      annotations:
        checksum/config: {{ .Values.cloudAgent.config | sha256sum }}
        {{- include "hypothesisloop.secretAnnotations" . | nindent 8 }}
    spec:
      {{- $cluster := required "cloudAgent.clusterName is required when cloudAgent.enabled is true: the cluster_name of its config" .Values.cloudAgent.clusterName }}
      {{- $org := required "cloudAgent.org is required when cloudAgent.enabled is true: the org the cluster is registered for" .Values.cloudAgent.org }}
      # Registering a cluster its org already owns changes nothing and prints the same token, so
      # every start of the pod does it again. It fails, and the pod waits, until control-service
      # has made the tables.
      initContainers:
        {{- include "hypothesisloop.tokenInit" (dict "script" (printf "/hl-admin cluster add %s %s > /token/token && /hl-admin cluster share %s %s" $cluster $org $cluster (ternary "on" "off" .Values.cloudAgent.shared)) "root" $) | nindent 8 }}
      containers:
        - name: cloud-agent
          image: {{ include "hypothesisloop.image" (dict "name" "cloud-agent" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "hypothesisloop.securityContext" $ | nindent 10 }}
          command: ["/bin/sh", "-ec", "RUNTIME_TOKEN=\"$(cat /token/token)\" exec /cloud-agent"]
          env:
            - name: CLOUD_AGENT_CONFIG
              value: /settings/cloud-agent.yaml
            {{- include "hypothesisloop.secretEnv" (dict "keys" .Values.cloudAgent.secretEnv "root" $) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /settings
              readOnly: true
            - name: token
              mountPath: /token
              readOnly: true
          resources:
            {{- toYaml .Values.cloudAgent.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: hypothesisloop-cloud-agent-config
        {{- include "hypothesisloop.tokenVolumes" . | nindent 8 }}
{{- end }}
