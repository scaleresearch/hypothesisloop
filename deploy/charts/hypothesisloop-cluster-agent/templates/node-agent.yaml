apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypothesisloop-node-agent
  namespace: {{ .Release.Namespace }}
---
# The agent lists the job pods of its own node to name the job behind each cgroup it measures.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hypothesisloop-node-agent
  namespace: hypothesisloop-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypothesisloop-node-agent
  namespace: hypothesisloop-jobs
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-node-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: hypothesisloop-node-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hypothesisloop-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: hypothesisloop-node-agent
spec:
  selector:
    matchLabels:
      app: hypothesisloop-node-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-node-agent
    spec:
      serviceAccountName: hypothesisloop-node-agent
      {{- with .Values.nodeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-agent
          image: {{ required "images.registry is required" .Values.images.registry }}/hypothesisloop-node-agent:{{ .Values.images.tag | default .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HYPOTHESISLOOP_CONTROL_PLANE_URL
              value: {{ required "metricsURL is required" .Values.metricsURL | quote }}
            - name: RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hypothesisloop-runtime-token
                  key: token
            - name: PUSH_INTERVAL_MS
              value: "2000"
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            # cpu limit: kept well above the request (unlike memory, which the process
            # genuinely never exceeds) because a too-tight CPU quota starves the container
            # right at startup — the runtime's own namespace-setup handshake (a few
            # synchronous forks/execs) needs a short burst, and if the cgroup throttles that
            # burst the container can fail to start entirely ("runc create failed ...
            # namespace path: lstat /proc/<pid>/ns/ipc: no such file", "sync with stage-1")
            # instead of just running slower. Bit for bit this looks like a runtime bug, but
            # it's actually a starved-cgroup symptom — seen repeatedly at 50m under any real
            # contention (several agents/pods starting at once).
            limits:
              cpu: "250m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      tolerations:
        - operator: Exists
