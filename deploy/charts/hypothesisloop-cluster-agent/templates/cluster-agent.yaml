apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypothesisloop-cluster-agent
  namespace: {{ .Release.Namespace }}
---
# Everything the agent changes is in hypothesisloop-jobs, so the rights to change anything are a
# Role there. What it reads outside that namespace is the ClusterRole below, which changes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hypothesisloop-cluster-agent
  namespace: hypothesisloop-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    # get+delete are what deliver a policy termination's checkpoint window. Deleting a Job hands
    # its pods to the garbage collector, which uses the POD's own grace and cannot be told
    # otherwise — so DeleteWorkload deletes the pods itself, with an explicit grace, before
    # touching the Job. Without delete here every teardown 403s and the workload is never
    # removed; without get it cannot read back the grace the pod was compiled with.
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    # FetchLogTail reads a job's own pod's stdout/stderr to report beside its phase. Without
    # this GetLogs 403s, which reads the same as a pod that has not started.
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    # One headless Service per multi-node job, for its pods to find each other.
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    # One ResourceClaimTemplate per job that asks for a DRA device.
    resources: ["resourceclaimtemplates"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    # One NetworkPolicy per multi-node job, letting its pods reach each other.
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    # One image pull Secret per job whose image is in its org's private repository, holding the
    # control plane's short-lived read-only login to it.
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypothesisloop-cluster-agent
  namespace: hypothesisloop-jobs
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-cluster-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: hypothesisloop-cluster-agent
  apiGroup: rbac.authorization.k8s.io
---
# Read only. It is what the capacity this cluster reports is counted from: the nodes, every pod
# on them whoever started it, and the DRA devices and the claims that hold them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypothesisloop-cluster-agent-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # kube-system's UID is the identity this cluster reports.
    resources: ["namespaces"]
    resourceNames: ["kube-system", "hypothesisloop-jobs"]
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    resourceNames: ["hypothesisloop-jobs-guaranteed", "hypothesisloop-jobs-burst"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypothesisloop-cluster-agent-reader
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-cluster-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: hypothesisloop-cluster-agent-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-cluster-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: hypothesisloop-cluster-agent
spec:
  # Every replica independently reconciles (the reconcile exchange is idempotent, and
  # Job create/delete are idempotent), so no leader election is needed. One is enough for most
  # deployments.
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-cluster-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-cluster-agent
    spec:
      serviceAccountName: hypothesisloop-cluster-agent
      containers:
        - name: cluster-agent
          image: {{ required "images.registry is required" .Values.images.registry }}/hypothesisloop-cluster-agent:{{ .Values.images.tag | default .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLUSTER_NAME
              value: {{ required "clusterName is required" .Values.clusterName | quote }}
            - name: API_URL
              value: {{ required "apiURL is required" .Values.apiURL | quote }}
            - name: RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hypothesisloop-runtime-token
                  key: token
            # Operator-set claim that this cluster sits behind a native autoscaler
            # (cluster-autoscaler / Karpenter) that reacts to Pending pods. Fail-closed default
            # false: a false positive here costs a job a wasted scale-up deadline, so this is
            # never heuristically detected. See autoscaler.md.
            - name: AUTOSCALER_ENABLED
              value: {{ .Values.autoscalerEnabled | quote }}
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            # See node-agent.yaml's resources comment: a tight cpu limit starves
            # the container's own startup handshake, not just its steady-state work.
            limits:
              cpu: "300m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      # Runs on a node kept free of workloads (local development's no-workload taint) or on a
      # control-plane node, so it has somewhere to run before any workload node is attached.
      # Never a toleration of every taint, as node-agent.yaml has: that covers
      # node.kubernetes.io/unreachable too, so the scheduler binds this one pod to a node whose
      # machine is gone, where it stays Pending and the cluster never connects.
      tolerations:
        - key: hypothesisloop.io/no-workload
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
