# Settings of one cluster's HypothesisLoop runtime. These values are the cluster's one config
# file: `helm get values hypothesisloop-cluster-agent -n hypothesisloop` prints them.
#
# Required, and shown pre-filled by the UI (Compute Resources > Add cluster) or `hl cluster add`:
# clusterName, apiURL, metricsURL, runtimeToken and images.registry. None has a default, so an
# install that misses one fails before anything is created. images.tag is shown too.

# Name this cluster was registered under.
clusterName: ""
# Control-plane API base URL. Handed to training pods as well, so it must be reachable from inside
# a pod in this cluster. Pods resolve names with the cluster's DNS, which does not know tailnet
# (MagicDNS) names: a control plane on a tailnet is named by its IP, here and in metricsURL.
apiURL: ""
# This cluster's runtime token, given when the cluster was registered for its org. The chart keeps
# it in the Secret hypothesisloop-runtime-token. A token for another name, or for a name nobody
# registered, is refused.
runtimeToken: ""
# metrics-service base URL node-agents push observations to. node-agent POSTs to
# <metricsURL>/internal/node-metrics, served only by metrics-service: a control-service URL here
# makes every push 404 silently.
metricsURL: ""
# true only if this cluster runs a native autoscaler (cluster-autoscaler / Karpenter) that reacts
# to Pending pods. See autoscaler.md.
autoscalerEnabled: "false"
# helm uninstall removes the cluster from the control plane and stops its jobs before the
# release goes. false leaves the cluster registered, for a release that is coming back.
detachOnUninstall: true

jobs:
  # Whether a job's pod may evict pods of lower priority to get a node. false makes job pods
  # wait for room, so they never evict another workload of a cluster this runtime shares.
  preemptLowerPriorityPods: false

nodeAgent:
  # Node labels the node-agent DaemonSet is limited to, for a cluster where only some nodes run
  # jobs. Empty runs it on every node.
  nodeSelector: {}

images:
  # Registry the agents' images are pulled from, as every node in this cluster reaches it
  # (host[:port][/path]). It holds hypothesisloop-cluster-agent and hypothesisloop-node-agent.
  registry: ""
  # Tag of those images. The control plane names the one it runs with. The cluster-agent reports
  # it, and the control plane shows a cluster whose tag differs from its own. Left empty, the
  # chart's appVersion, which is the tag it was published with.
  tag: ""

# For a registry that serves plain HTTP with no TLS, such as the local development registry: true
# runs a DaemonSet that writes a containerd hosts.toml for images.registry on every node, so the
# agents' and the jobs' images are pulled from it over HTTP. Off by default: a registry of TLS
# needs none of it. The command `hl cluster add` prints sets it when the control plane's registry
# is one of plain HTTP (runtimes.registry_plain_http).
insecureRegistry:
  enabled: false
  # containerd's registry hosts directory on the nodes (its registry config_path). k3s and RKE2:
  # /var/lib/rancher/k3s/agent/etc/containerd/certs.d (RKE2: /var/lib/rancher/rke2/...). Plain
  # containerd: /etc/containerd/certs.d, with config_path set to it in its config.toml.
  hostsDir: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
  # The image that writes the file, pulled from its own registry.
  image: docker.io/library/busybox:1.37.0

# The kube context the install was run against. Only the notes read it, to print kubectl commands
# that reach this cluster from where helm ran. make cluster-agent-up sets it.
kubeContext: ""
