# Default values for the hypothesisloop chart.
#
# Platform policy (accelerator prices, quota, stage ladder, scheduler timing) is not repeated
# here. It lives in controlplane/settings/hypothesisloop.yaml, which `make helm-prepare` stages
# into files/hypothesisloop.yaml and templates/config.yaml renders into the ConfigMap. This file
# holds what differs per deployment: images, addresses, sizes, and which stores run in-cluster.

namespace:
  create: true
  name: hypothesisloop

images:
  # The registry `make publish REGISTRY=...` pushed to. Required: every node must be able to pull
  # from it, and no address is a safe guess.
  registry: ""
  pullPolicy: IfNotPresent
  # The TAG the images were published under. Left empty, the chart's appVersion, which is the TAG
  # it was published with. It names the tree content that was built, so IfNotPresent never runs
  # stale bytes under a reused tag.
  tag: ""

# Every secret comes from this one Secret, which must exist in the namespace before the chart is
# installed. The chart reads it and never creates it. Required. A provider's secret is named
# <SECTION>_<PROVIDER>_<FIELD>, as the settings name the section and the provider. Its keys:
#
#   DATABASE_URL                     Postgres connection string. With postgres.enabled it is
#                                    postgres://<postgres.user>:<POSTGRES_PASSWORD>@hypothesisloop-postgres:5432/<postgres.database>?sslmode=disable
#   POSTGRES_PASSWORD                only with postgres.enabled
#   AUTH_SIGNING_SECRET              derives every token the platform hands out, 32 characters or
#                                    more. Whoever holds it can mint a staff token.
#   MODEL_ANTHROPIC_OAUTH_TOKEN      the Claude subscription token control-service makes every
#                                    sandboxed agent's model calls with (models in
#                                    hypothesisloop.yaml). No agent's machine is given it.
#   OBJECT_STORE_MINIO_SECRET_ACCESS_KEY  the secret key of object_store.minio.access_key_id in
#                                    hypothesisloop.yaml, a key that may create service accounts;
#                                    with objectStore.enabled the two are the store's root user
#   GIT_HOST_GITHUB_APP_PRIVATE_KEY  only with gitHost.provider github: the PEM GitHub issued for
#                                    the App
#   GIT_HOST_PLAIN_PASSWORD          only with gitHost.plain.username: that account's password
#   CONTAINER_REGISTRY_GCP_CREDENTIALS  only with containerRegistry.provider gcp: control-service's
#                                    own Google identity, as an application default credentials
#                                    file (a service account key or a workload identity
#                                    federation config), which may mint the tokens of
#                                    containerRegistry.gcp.pusher and containerRegistry.gcp.puller
#   SANDBOX_<PROVIDER>_API_KEY, CLOUD_COMPUTE_<PROVIDER>_API_KEY
#                                    the account key of the provider sandbox and each cloudCompute
#                                    entry name, such as SANDBOX_FLY_API_KEY and
#                                    CLOUD_COMPUTE_VAST_API_KEY
#
# Each process is handed the keys it reads and no other.
secretName: ""

# Set to any string that changes when the Secret's content does (a hash of it). It is stamped on
# every pod that reads the Secret, so a changed secret restarts them.
secretChecksum: ""

# Read by no template. An installer that hands helm this chart as a local path sets it to a hash
# of the chart's files, so that an edited template makes a changed release.
chartChecksum: ""

# Who may call the API: the auth section of hypothesisloop.yaml, which explains each value. The
# signing secret is not here. It comes from the Secret.
auth:
  # The identity providers people sign in with, written as they are into auth.identity_providers
  # of hypothesisloop.yaml, so each entry has that file's keys: issuer, audience and jwt_keys. A
  # deployment lists the one it uses. With none listed no person's token is accepted and the API
  # takes API keys and derived tokens only.
  # jwt_keys are the provider's public keys as its JWKS document lists them, with these fields
  # only: kid, kty, alg and crv, x, y (ES256) or n, e (RS256). In a values file write "y" and "n"
  # in quotes: helm reads a bare y or n as a boolean.
  identityProviders: []
  # Required: the address people open the UI at.
  uiOrigin: ""

# The git host platform experiments keep their code on: the git_host section of
# hypothesisloop.yaml, which explains each value. Required: provider is github or plain, and only
# the section of that name is read.
gitHost:
  provider: ""
  # Required: the repository on the git host every repository the platform creates starts from:
  # on GitHub the platform's public template, on a plain host a name under baseURL holding a copy
  # of it.
  experimentTemplateRepository: ""
  # The GitHub App a project's repository is reached through. Its private key comes from the Secret.
  github:
    appId: 0
    appSlug: ""
  # Any git host that serves repositories under one root.
  plain:
    # The https root repositories are cloned from.
    baseURL: ""
    # true lets baseURL be http, for a host on the deployment's own network.
    allowHTTP: false
    # The account the platform and every agent reach the host as. Its password is the Secret's
    # GIT_HOST_PLAIN_PASSWORD. Left empty for a host that asks for no credential.
    username: ""

# The registry provider whose logins control-service hands out for environment images, and the
# repository they are pushed to: the container_registry section of hypothesisloop.yaml, which
# explains each value. With provider empty the deployment builds no environments. With it set,
# environmentsRepository is required, and so is that provider's section:
#   gcp  Google Artifact Registry: the two service accounts, pusher and puller, and the Secret's
#        CONTAINER_REGISTRY_GCP_CREDENTIALS, which mints their tokens.
containerRegistry:
  provider: ""
  gcp:
    pusher: ""
    puller: ""
  environmentsRepository: ""

# Required: the one address this API is reached at from outside the control plane, by sandboxed
# agents and by every cluster's runtime. services.public_api_url of hypothesisloop.yaml.
publicAPIURL: ""

# Sandboxed agents: the agents section of hypothesisloop.yaml.
agents:
  # Required: the image a sandboxed agent's machine boots, pullable from the sandbox provider.
  image: ""

# Where a cluster's runtime sends metrics: the runtimes section of hypothesisloop.yaml. It is
# handed out when a cluster is registered and must be reachable from inside every cluster that
# runs jobs. The section's registry and image_tag are images.registry and images.tag above: a
# cluster's runtime installs the images this release runs.
runtimes:
  # Required: metrics-service.
  metricsURL: ""

postgres:
  # false when DATABASE_URL in the Secret points at a database run elsewhere.
  enabled: true
  image: postgres:16-alpine
  user: hypothesisloop
  database: hypothesisloop
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

greptimedb:
  image: greptime/greptimedb:v1.2.1
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # A metrics store run elsewhere instead of the StatefulSet: its http URL.
  external:
    enabled: false
    url: ""

# The hypothesis graph, read and written only by control-service. One shared instance. Pinned: the
# schema bootstrap and the read-only query guard (controlplane/storage/graphdb) were verified
# against exactly this version.
memgraph:
  image: memgraph/memgraph:3.13.1
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }
  # An existing Memgraph instead of the StatefulSet: its bolt URL, e.g. bolt://memgraph.example:7687.
  external:
    enabled: false
    url: ""

# Durable-data object store: the object_store section of hypothesisloop.yaml, which names its
# provider and that provider's section.
objectStore:
  # Deploys Silo, in which control-service creates the bucket named in hypothesisloop.yaml at
  # start, with the root user of object_store.minio there. false when endpoint names a store run
  # elsewhere.
  enabled: true
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  # object_store.endpoint: the address every job and agent is handed to reach the store at.
  # Required. Jobs in this cluster only: http://object-store.<namespace>.svc:9000. Jobs on other
  # clusters or rented hosts: an address they can reach, such as a tunnel URL to the NodePort.
  endpoint: ""
  # object_store.control_plane_endpoint: where the control plane itself reaches the store. With
  # enabled it is the chart's own Service and this stays empty. With a store run elsewhere it is
  # required: that store's address on the control plane's network.
  controlPlaneEndpoint: ""
  storage: 20Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  service:
    type: ClusterIP
    nodePort: 30900

controlService:
  replicas: 1
  port: 8081
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: ClusterIP
    nodePort: 30081

metricsService:
  replicas: 1
  port: 8084
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  service:
    type: ClusterIP
    nodePort: 30084

# Image hypothesisloop-ui. It reads its values from the environment the Deployment sets when it
# starts (controlplane/ui/.env.example): the API at publicAPIURL and the sign-in service below.
ui:
  enabled: true
  # Required with enabled: the service that signs people in, that provider's section, and the
  # sign-in providers the sign-in page offers, in order, of github, google and apple, each switched
  # on in that service. All are public values.
  #   supabase  a Supabase project: url, https://<project>.supabase.co, and its publishableKey.
  identity:
    provider: ""
    supabase:
      url: ""
      publishableKey: ""
    signInProviders: []
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  service:
    type: ClusterIP
    nodePort: 30300

# Machines control-service rents itself: the sandbox and cloud_compute sections of
# hypothesisloop.yaml, which controlplane/settings/sandbox.yaml and cloud-compute.yaml describe.
# Each is written into the settings as it is, so its keys are the settings' own, in snake_case: the
# provider's section is read by the provider's adapter alone, and the chart translates no key it
# does not read. Each names its provider and holds that provider's section and no other; they hold
# no secret: control-service is handed the provider's account key from the Secret. Without a
# sandbox no agent runs in an agent sandbox. Each cloud_compute entry is a cluster registered as any
# other (hl-admin cluster add, run in the control-service pod), and nothing is rented for it until
# it is.
sandbox: {}
cloudCompute: []
