{{- /*
The staged hypothesisloop.yaml with what differs per deployment set from values. It holds no
secret: each service reads its own from the Secret, through its environment.
*/ -}}
{{- $raw := include "hypothesisloop.stagedConfig" . }}
{{- $staged := $raw | fromYaml }}
{{- /*
The staged file names no git host, registry or rented machines: the chart adds those the values name.
*/ -}}
{{- range list "git_host" "container_registry" "sandbox" "cloud_compute" }}
{{- if hasKey $staged . }}
{{- fail (printf "files/hypothesisloop.yaml has a %s section, and the chart would add a second one" .) }}
{{- end }}
{{- end }}
{{- $set := list
  (list "services" "api_port" (int .Values.controlService.port))
  (list "services" "metric_controller_port" (int .Values.metricsService.port))
  (list "services" "public_api_url" (required "publicAPIURL is required: the address sandboxed agents and every cluster's runtime reach the API at" .Values.publicAPIURL))
  (list "auth" "identity_providers" .Values.auth.identityProviders)
  (list "auth" "ui_origin" (required "auth.uiOrigin is required: the one browser origin allowed to call the API, which is the address people open the UI at" .Values.auth.uiOrigin))
  (list "agents" "image" (required "agents.image is required: the image a sandboxed agent's machine boots" .Values.agents.image))
  (list "runtimes" "metrics_url" (required "runtimes.metricsURL is required: the address a cluster's runtime reaches metrics-service at" .Values.runtimes.metricsURL))
  (list "runtimes" "registry" (required "images.registry is required: pass the REGISTRY `make publish` pushed to" .Values.images.registry))
  (list "runtimes" "image_tag" (.Values.images.tag | default .Chart.AppVersion))
  (list "object_store" "endpoint" (required "objectStore.endpoint is required: the address every job and agent is handed to reach the object store at" .Values.objectStore.endpoint))
  (list "object_store" "control_plane_endpoint" (include "hypothesisloop.objectStoreControlPlaneEndpoint" .))
}}
{{- range $set }}
{{- $raw = include "hypothesisloop.setConfig" (dict "text" $raw "section" (index . 0) "key" (index . 1) "value" (index . 2)) }}
{{- end }}
{{- /*
The git host gitHost.provider names, with its section.
*/ -}}
{{- $gitHost := .Values.gitHost }}
{{- if eq $gitHost.provider "github" }}
{{- if not $gitHost.github.appId }}
{{- fail "gitHost.github.appId is required with gitHost.provider github: the App's number" }}
{{- end }}
{{- $raw = printf "%s\ngit_host:\n  provider: github\n  experiment_template_repository: %s\n  github:\n    app_id: %s\n    app_slug: %s\n    client_id: %s\n" (trimSuffix "\n" $raw)
  (toJson (required "gitHost.experimentTemplateRepository is required: the repository every repository the platform creates starts from" $gitHost.experimentTemplateRepository))
  (toJson (int64 $gitHost.github.appId))
  (toJson (required "gitHost.github.appSlug is required with gitHost.provider github: the name in the App's URL" $gitHost.github.appSlug))
  (toJson (required "gitHost.github.clientId is required with gitHost.provider github: the App's client ID" $gitHost.github.clientId)) }}
{{- else if eq $gitHost.provider "plain" }}
{{- $raw = printf "%s\ngit_host:\n  provider: plain\n  experiment_template_repository: %s\n  plain:\n    base_url: %s\n    allow_http: %s\n" (trimSuffix "\n" $raw)
  (toJson (required "gitHost.experimentTemplateRepository is required: the repository every repository the platform creates starts from" $gitHost.experimentTemplateRepository))
  (toJson (required "gitHost.plain.baseURL is required with gitHost.provider plain: the root the deployment's repositories are cloned from" $gitHost.plain.baseURL))
  (toJson $gitHost.plain.allowHTTP) }}
{{- if $gitHost.plain.username }}
{{- $raw = printf "%s    username: %s\n" $raw (toJson $gitHost.plain.username) }}
{{- end }}
{{- else }}
{{- fail (printf "gitHost.provider is %q: it is github or plain" $gitHost.provider) }}
{{- end }}
{{- /*
The registry containerRegistry.provider names, with its section.
*/ -}}
{{- with .Values.containerRegistry }}
{{- if eq .provider "gcp" }}
{{- $raw = printf "%s\ncontainer_registry:\n  provider: gcp\n  gcp:\n    project: %s\n    location: %s\n" (trimSuffix "\n" $raw)
  (toJson (required "containerRegistry.gcp.project is required with containerRegistry.provider gcp: the Google Cloud project the repositories are kept in" .gcp.project))
  (toJson (required "containerRegistry.gcp.location is required with containerRegistry.provider gcp: the Artifact Registry location, such as europe-west1" .gcp.location)) }}
{{- else if or .gcp.project .gcp.location }}
{{- fail "a containerRegistry provider's section is set without containerRegistry.provider" }}
{{- end }}
{{- end }}
{{- /*
The sandbox and cloud_compute sections the values hold, written as they are.
*/ -}}
{{- with .Values.sandbox }}
{{- $raw = printf "%s\nsandbox:\n%s" (trimSuffix "\n" $raw) (toYaml . | indent 2) }}
{{- end }}
{{- with .Values.cloudCompute }}
{{- $raw = printf "%s\ncloud_compute:\n%s" (trimSuffix "\n" $raw) (toYaml . | indent 2) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypothesisloop-config
  namespace: {{ include "hypothesisloop.namespace" . }}
data:
  hypothesisloop.yaml: |
{{ $raw | indent 4 }}
