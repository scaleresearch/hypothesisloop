{{- if .Values.objectStore.enabled }}
{{- $store := include "hypothesisloop.objectStore" . | fromYaml }}
{{- if ne $store.provider "minio" }}
{{- fail (printf "objectStore.enabled runs a store that speaks the MinIO admin API, and files/hypothesisloop.yaml names object_store provider %q" $store.provider) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  type: {{ .Values.objectStore.service.type }}
  selector:
    app: hypothesisloop-object-store
  ports:
    - port: 9000
      targetPort: 9000
      {{- if eq .Values.objectStore.service.type "NodePort" }}
      nodePort: {{ .Values.objectStore.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypothesisloop-object-store
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  serviceName: object-store
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-object-store
  template:
    metadata:
      labels:
        app: hypothesisloop-object-store
      annotations:
        {{- include "hypothesisloop.secretAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: silo
          image: {{ .Values.objectStore.image }}
          args: ["server", "/data", "--address", "0.0.0.0:9000"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ required "files/hypothesisloop.yaml has no object_store.minio.access_key_id" (dig "minio" "access_key_id" "" $store) | quote }}
            {{- include "hypothesisloop.secretKey" (dict "env" "MINIO_ROOT_PASSWORD" "key" (include "hypothesisloop.objectStoreSecretKey" $) "root" $) | nindent 12 }}
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.objectStore.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.objectStore.storageClassName }}
        storageClassName: {{ .Values.objectStore.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.objectStore.storage }}
{{- end }}
