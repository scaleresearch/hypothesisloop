apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  type: {{ .Values.metricsService.service.type }}
  selector:
    app: hypothesisloop-metrics-service
  ports:
    - port: {{ .Values.metricsService.port }}
      targetPort: {{ .Values.metricsService.port }}
      {{- if eq .Values.metricsService.service.type "NodePort" }}
      nodePort: {{ .Values.metricsService.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-metrics-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  replicas: {{ .Values.metricsService.replicas }}
  selector:
    matchLabels:
      app: hypothesisloop-metrics-service
  template:
    metadata:
      labels:
        app: hypothesisloop-metrics-service
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- include "hypothesisloop.secretAnnotations" . | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h hypothesisloop-postgres -U {{ .Values.postgres.user }}; do sleep 2; done"]
      {{- end }}
      containers:
        - name: metrics-service
          image: {{ include "hypothesisloop.image" (dict "name" "metrics-service" "root" $) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "hypothesisloop.securityContext" . | nindent 10 }}
          env:
            - name: HYPOTHESISLOOP_CONFIG
              value: /settings/hypothesisloop.yaml
            {{- include "hypothesisloop.metricsServiceEnv" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.metricsService.port }}
          volumeMounts:
            - name: config
              mountPath: /settings
              readOnly: true
          resources:
            {{- toYaml .Values.metricsService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.metricsService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.metricsService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: hypothesisloop-config
{{- if gt (int .Values.metricsService.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hypothesisloop-metrics-service
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hypothesisloop-metrics-service
{{- end }}
