{{- if not .Values.memgraph.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: memgraph
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  selector:
    app: hypothesisloop-memgraph
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hypothesisloop-memgraph
  namespace: {{ include "hypothesisloop.namespace" . }}
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-memgraph
  template:
    metadata:
      labels:
        app: hypothesisloop-memgraph
    spec:
      securityContext:
        # The image runs as the memgraph user (uid 101, gid 103); the data volume must be writable by it.
        fsGroup: 103
      containers:
        - name: memgraph
          image: {{ .Values.memgraph.image }}
          # The graph lives in memory; the WAL (fsynced on every commit) and snapshots on the PVC are
          # what a restart or a crash recovers it from.
          args:
            - "--telemetry-enabled=false"
            - "--data-recovery-on-startup=true"
            - "--storage-wal-enabled=true"
            - "--storage-wal-file-flush-every-n-tx=1"
            - "--storage-snapshot-interval-sec=300"
            - "--storage-snapshot-on-exit=true"
          ports:
            - containerPort: 7687
          volumeMounts:
            - name: data
              mountPath: /var/lib/memgraph
          resources:
            {{- toYaml .Values.memgraph.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 2
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.memgraph.storageClassName }}
        storageClassName: {{ .Values.memgraph.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.memgraph.storage }}
{{- end }}
