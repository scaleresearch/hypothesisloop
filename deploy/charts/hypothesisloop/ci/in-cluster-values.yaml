# A self-hosted install with every store in the cluster, no identity provider and its own git host. Every value is
# made up. The chart's tests render it (deploy/charts/hypothesisloop/chart_test.go).
namespace:
  create: false
images:
  registry: registry.example.invalid
  tag: test
secretName: hypothesisloop
auth:
  uiOrigin: http://ui.example.invalid:30300
agents:
  image: registry.example.invalid/hypothesisloop-harness-base:test
publicAPIURL: http://api.example.invalid:30081
runtimes:
  metricsURL: http://metrics.example.invalid:30084
objectStore:
  endpoint: http://object-store.hypothesisloop.svc:9000
gitHost:
  provider: plain
  plain:
    baseURL: https://git.example.invalid/experiments
    username: made-up-git-account
ui:
  identity:
    provider: supabase
    supabase:
      url: https://project.supabase.example.invalid
      publishableKey: sb_publishable_made-up
