# Example request body for POST /experiments: one submission, one file.
#
# The request has two top-level sections:
#   - job:      the platform's own job DSL (domain.JobSpec) — what to run and with what
#               resources. This is NOT a Kubernetes manifest and never will be: Kubernetes
#               (or whatever backend is configured) is treated purely as a downlevel
#               execution engine. The backend compiles this down into whatever native
#               resource it needs (a batch/v1 Job today). Execution-affecting fields are
#               explicit so the same desired state compiles identically on every cluster.
#   - metadata: the research/bookkeeping fields (hypothesis, project linkage, cost tier,
#               ...) that have nothing to do with how the job executes.
#
# Most of this file is optional. The least a request states is metadata.hypothesis_id and
# metadata.theory, and in job a command, cpu, memory and storage, with
# accelerator_type and accelerator_count for a job on an accelerator.
#
# An experiment's repository commits the job section alone, as .hypothesisloop/job.yaml
# (the experiment template holds it), and every trial submits that file unedited:
#
#   hl job submit .hypothesisloop/job.yaml --hypothesis ID --theory "..." --env KEY=VALUE
#
# The flags set what differs from one trial to the next. hl fills in the rest of metadata: the
# agent and the platform experiment from its token (--agent and --platform-experiment for a
# person or an API key), and code_ref and branch from the clone it is run in. The platform
# issues the job's id, job-<32 hex digits>, and the submit prints it.

job:
  # --- What to run -------------------------------------------------------------------
  # Required. Every node fetches the commit the job was submitted from into /workspace/code and
  # runs the command there, in the image the platform experiment records (hl image show, hl image
  # set), on nodes of its architecture. The job names no image.
  command: ["python", "train.py"]
  env:
    MY_APP_CONFIG: "whatever-your-training-code-needs"
  # secret_env: environment variables the job needs and nobody may read back, such as a token for
  # a dataset host. The job gets them exactly like env; every read of the job returns env and
  # never secret_env. A name may be in one of the two only. It is sent in the request body alone:
  # `hl job submit` refuses a file that carries it and takes `--secret-env NAME`, which reads
  # $NAME from the caller's environment, so no value is committed or put on a command line.

  # --- Resources ---------------------------------------------------------------------
  # cpu/memory/storage: the cores and the memory one node of the job uses and the scratch space
  # it writes, each always stated as a plain quantity string. One left out, or "max", is refused
  # with 422 required, the field named in problems. A job holds what it states and
  # nothing is sized from the node it lands on. In a grouped job every group states all three.
  cpu: "4"
  memory: "16Gi"
  storage: "10Gi"

  # accelerator_type/accelerator_count: the only place accelerator count is declared — a plain
  # integer, not a k8s resource string. accelerator_count is PER NODE (see num_nodes below);
  # billing/quota accounting use accelerator_count * num_nodes. Every resource dimension here
  # is also subject to the operator's per-job maximum caps (hypothesisloop.yaml's
  # quota.max_accelerator_count_per_job etc) — exceeding a cap is rejected at admission, before
  # any quota is touched.
  #
  # A job that needs no accelerator leaves both out and holds its cores, a whole number:
  # cpu: "4" holds 4 CPU cores (4 units of the type hypothesisloop.dev/cpu=core, 4 core-hours an
  # hour).
  accelerator_count: 1
  # accelerator_type names the hardware the way its own driver publishes it, as a fully-qualified
  # "key=value" — NVIDIA's GPU Feature Discovery writes the node label
  # nvidia.com/gpu.product=NVIDIA-H100-80GB-HBM3; Tenstorrent's DRA driver publishes the device
  # attribute tenstorrent.com/chipArch=blackhole. Read GET /resource-catalog/capacity to see
  # exactly which strings a cluster currently has, and submit one of them verbatim: capacity,
  # billing and placement all use this same string, so there is nothing to translate.
  #
  # How it is requested (a DRA claim, or an extended resource plus node affinity) is worked out
  # from the cluster's live inventory — never declared here.
  accelerator_type: nvidia.com/gpu.product=NVIDIA-H100-80GB-HBM3

  # acceptable_accelerator_types: alternatives this job runs equally well on, in preference order.
  # Admission may place the job on any of them when the first choice is busy, and bills whichever
  # one actually ran.
  # acceptable_accelerator_types:
  #   - nvidia.com/gpu.product=NVIDIA-A100-80GB-PCIE

  # accelerator_tolerations: taint keys to tolerate so the pod may land on tainted accelerator
  # nodes (whether a cluster taints them is a property of that cluster, not of the hardware).
  accelerator_tolerations: [nvidia.com/gpu]

  # accelerator_pod_resources: extra per-node requests of this job's own beside the device.
  # What a type always needs is the platform's: it adds the hugepages a Tenstorrent chip's
  # driver maps to every job on that type, so no job states them.

  # node_selector: ordinary Kubernetes node selection for anything that is NOT the accelerator —
  # a zone, a disk class, a kernel version. ANDed with wherever the accelerator lives. Optional.
  # node_selector: {topology.kubernetes.io/zone: us-east-1a}

  # extra_resources: any k8s extended resource beyond accelerator_type/accelerator_count — TPUs
  # (google.com/tpu), other AI accelerators (habana.ai/gaudi, aws.amazon.com/neuron, ...), or
  # anything else a device plugin advertises. Plain quantity strings per node, like
  # cpu/memory/storage. Unlike accelerator_count, NOT billed or capped by quota — passes
  # straight through to the pod's resource requests.
  # extra_resources:
  #   google.com/tpu: "8"

  # --- Distributed training ------------------------------------------------------------
  # num_nodes > 1 requests a real multi-host distributed run. The backend handles everything
  # needed to make torchrun/Horovod-style training (or Ray) work: rank assignment, a stable
  # rendezvous address, per-node retry isolation (one flaky node doesn't burn through every
  # other node's retry budget), and completion gated on rank 0 finishing (stragglers on other
  # ranks don't hold up the job). Every node gets these env vars automatically, no further DSL
  # needed:
  #   HYPOTHESISLOOP_RANK         this node's index (0 = rank 0 / the "master"/"head")
  #   HYPOTHESISLOOP_WORLD_SIZE   total node count (== num_nodes)
  #   HYPOTHESISLOOP_MASTER_ADDR  rank 0's stable DNS name (a headless Service is created
  #                             alongside the job so this actually resolves)
  #   HYPOTHESISLOOP_MASTER_PORT  fixed rendezvous port (29500) — one job, one port, no
  #                             cross-job collision
  #
  # PyTorch DDP: run `torchrun --nnodes=$HYPOTHESISLOOP_WORLD_SIZE
  # --node-rank=$HYPOTHESISLOOP_RANK --master-addr=$HYPOTHESISLOOP_MASTER_ADDR
  # --master-port=$HYPOTHESISLOOP_MASTER_PORT train.py` as this job's command on every node —
  # torchrun itself handles the rest (worker processes, NCCL init).
  #
  # Ray (e.g. RLlib for RL training): rank 0 runs `ray start --head
  # --port=$HYPOTHESISLOOP_MASTER_PORT` then submits the job locally; every other rank runs
  # `ray start --address=$HYPOTHESISLOOP_MASTER_ADDR:$HYPOTHESISLOOP_MASTER_PORT --block` (a
  # worker that just joins the cluster and blocks). A simple shell entrypoint branching on
  # `[ "$HYPOTHESISLOOP_RANK" = "0" ]` covers both roles from one command.
  num_nodes: 1

  # topology: placement requirements for a distributed run — only meaningful when num_nodes > 1.
  # topology:
  #   # spread_across_hosts (default true when num_nodes > 1): no two of this job's nodes land
  #   # on the same physical host, so you get real parallelism instead of ranks sharing a
  #   # host's accelerators. Set false only on a small dev cluster with fewer hosts than num_nodes.
  #   spread_across_hosts: true
  #   # same_zone (default false): best-effort preference to keep this job's nodes in the same
  #   # topology zone/rack, minimizing cross-zone latency for gradient all-reduce (NCCL). A
  #   # preference, not a requirement — enforcing it could leave the job unschedulable.
  #   same_zone: true

  # shm_size: /dev/shm size (e.g. "4Gi"). k8s defaults /dev/shm to a tiny tmpfs, which
  # silently breaks PyTorch's multiprocess DataLoader workers and NCCL's shared-memory IPC
  # under load — both are common requirements for real multi-accelerator/multi-host training.
  # Omit to use no explicit shared-memory volume.
  # shm_size: "4Gi"

  # --- Retry -----------------------------------------------------------------------------
  # max_retries: how many times a failing node is retried before the job is marked failed.
  # Left out, it is 0: the job runs once, which is right for a failure that would repeat (a
  # bad path, an out-of-memory). Set it only for a failure known to be flaky.
  # max_retries: 1

metadata:
  # agent_id, platform_experiment_id: whose job it is and where it runs. An agent's token says
  # both, and hl sets both on every submit, so a file states neither.
  #
  # hypothesis_id, theory: REQUIRED, set with --hypothesis and --theory. hypothesis_id is the id
  # hl hypothesis submit printed: every job tests a hypothesis registered in its platform
  # experiment's graph. theory is what you predict this job will show. A baseline agent's job
  # names neither.
  #
  # code_ref, branch: REQUIRED, filled by hl from the clone. code_ref is the platform
  # experiment's repository at a commit, <repository_url>@<40-hex-commit-sha>; any other
  # address is refused (code_ref_not_in_repository). branch is the branch that commit is on,
  # under hl/<platform experiment>/ (branch_not_of_experiment for any other).
  #
  # estimated_duration_hours: what the job holds of its agent's quota until it ends. Leave it
  # out: the job then gets the estimate the platform measured on the experiment's baseline job,
  # and hl repo check fails a committed job spec that states one. --estimated-duration-hours
  # states it for one trial that will run longer.

  # config_hash, data_ref: optional pointers the training code knows how to resolve (a hash of
  # the resolved config, where the input dataset lives). Stored and returned as stated, never
  # checked.
  config_hash: "sha256:9f8e7d..."
  data_ref: "s3://research-datasets/finetune-corpus-v3"

  # guaranteed (never preempted, may preempt burst jobs) or burst (runs on idle capacity and may
  # be preempted). Both draw on the same quota. Left out, it is guaranteed. --capacity-tier
  # sets it for one submit.
  capacity_tier: guaranteed

  # parent_id: optional, the id of an earlier job (job-<32 hex digits>) this one continues.
  # parent_id: job-0198f2a13c9e7b219c4a2f6e1a8d5b3c
