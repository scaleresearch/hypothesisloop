# The base job spec of this experiment. Every trial is this file, submitted unedited:
#
#   hl job submit .hypothesisloop/job.yaml --hypothesis ID --theory "..." --env KEY=VALUE
#
# The flags set what differs from one trial to the next, and hl fills code_ref from the
# clone it runs in. `hl job submit --help` lists every field. No secret belongs here: a job takes
# one with --secret-env.
# No estimated_duration_hours is stated here. A job holds its estimate of its agent's quota from
# submit until it ends, and a job that states none gets the one the platform measured on the
# experiment's baseline job when it was declared: what it ran plus a half.
# The baseline job itself, which nothing was measured before, is given the largest its agent's
# quota admits. --estimated-duration-hours states one for a trial that will run longer.
job:
  # REQUIRED on every cluster, CPU, GPU or chip. The name
  # of a job image exactly as `hl capacity` shows it (job_image; the line of the type below
  # lists the ones that suit it as job_images, `python` for work on cores), or the full registry
  # address of an image of your own, host first (docker.io/library/python:3.13-slim). Anything
  # else is refused at submit (unknown_job_image), and so is a job no cluster could run with
  # its image (no_cluster_for_image). Where `hl capacity` shows the cluster with
  # only_job_image, name that image.
  image: REPLACE-WITH-A-JOB-IMAGE-NAME-HL-CAPACITY-LISTS
  # hl-clone checks out the commit the job was submitted from and prints its directory. Install
  # what a trial needs ahead of its command with `uv pip install PACKAGE` or
  # `pip install PACKAGE`, into the Python the job runs.
  command: ["bash", "-lc", "dir=$(hl-clone) && cd \"$dir\" && exec REPLACE-WITH-THE-COMMAND-OF-ONE-TRIAL"]
  # Copied verbatim from `hl capacity`. Work that needs no accelerator deletes both lines, and
  # its `cpu`, a whole number, is then the cores it holds and pays for.
  accelerator_type: REPLACE-WITH-AN-ACCELERATOR-TYPE-HL-CAPACITY-LISTS
  accelerator_count: 1
  # REQUIRED, all three, each a quantity: the cores and the memory one node of the job uses and
  # the scratch space it writes. One left out is refused at submit (cpu_required,
  # memory_required, storage_required), and so is more than every cluster that runs the job
  # has when idle (exceeds_cluster_capacity). A job holds what it states, so state what a trial
  # uses and other jobs run beside it.
  cpu: 2
  memory: 8Gi
  storage: 4Gi
