# The base job spec of this experiment. Every trial is this file, submitted unedited:
#
#   hl job submit .hypothesisloop/job.yaml --hypothesis ID --theory "..." --env KEY=VALUE
#
# The flags set what differs from one trial to the next, and hl fills id and code_ref from the
# clone it runs in. `hl job submit --help` lists every field. No secret belongs here: a job takes
# one with --secret-env.
# No estimated_duration_hours is stated here. A job holds its estimate of its agent's quota from
# submit until it ends, and a job that states none gets the one the platform measured on the
# experiment's baseline job when it was declared: what it ran plus a half.
# --estimated-duration-hours states it for one submit: for the baseline job itself, which has
# nothing measured yet, and for a trial that will run longer.
job:
  # REQUIRED: a job that names no image stays QUEUED and never runs. Copy the `image` of a job
  # image `hl capacity` lists for the type below, verbatim. Delete this line only where
  # `hl capacity` shows the cluster with only_job_image.
  image: REPLACE-WITH-AN-IMAGE-HL-CAPACITY-LISTS
  # hl-clone checks out the commit the job was submitted from and prints its directory.
  command: ["bash", "-lc", "cd \"$(hl-clone)\" && exec REPLACE-WITH-THE-COMMAND-OF-ONE-TRIAL"]
  # Copied verbatim from `hl capacity`. Work that needs no accelerator deletes both lines and
  # states `cpu: N`, whole cores.
  accelerator_type: REPLACE-WITH-AN-ACCELERATOR-TYPE-HL-CAPACITY-LISTS
  accelerator_count: 1
