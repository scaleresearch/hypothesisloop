# tt-small-node variant of job.yaml -- identical except host_mounts, which is a node-local path
# and therefore can't be shared verbatim across nodes. tt-small already has a COMPLETE copy of
# this dataset at its own native path (not the hypothesisloop-repo-relative path job.yaml uses on
# tt-quietbox): /home/tt-small/smri-fm/datasets/FOMO_with_dwi -- 67/67 shards, 40GB, verified
# byte-identical to this repo's copy by md5sum on shard.000000.tar and shard.000066.tar
# (2026-08-07). No re-download needed. (A second, separate copy exists at
# /home/tt-small/projects/smri-fm/datasets/FOMO_with_dwi -- only 53/67 shards, stale/incomplete,
# NOT what this points at.)
#
# tt-small was previously believed to have a hardware/build ABI incompatibility blocking real
# training here -- re-verified 2026-08-08 and that was wrong: the actual blocker was that the
# workload image and this platform's bare-metal agent binary were both stale on that host
# (image never loaded into its Docker; the agent binary predated the host_mounts wiring fix).
# Fixed by redeploying both. Device init and a real training job (kernel build -> optimizer
# step) were confirmed working end to end on real hardware via this exact job spec.
image: localhost/hypothesisloop-smri-fm-workload:latest
command: ["/build/smri-fm/seed/run_job.sh"]

host_mounts:
  /data/dataset: /home/tt-small/smri-fm/datasets/FOMO_with_dwi

# tt-small has exactly 1 chip (unlike tt-quietbox's 4), so -- unlike job.yaml -- there is no
# concurrency to size for here: at most one job can ever run on this node at a time regardless of
# cpu request. This value just needs to leave headroom for DaemonSet-reserved cores (see job.yaml)
# on THIS host's own allocatable, which was not independently re-checked when this was last set --
# verify with `kubectl describe node tt-small` (or equivalent) before trusting it at scale.
cpu: "14"
memory: "64Gi"
storage: "80Gi"
max_retries: 3

env:
  TT_METAL_REF: "d9a68815f5fcf08a5bfbffb6f1f811823fba8edd"
  HYPOTHESISLOOP_R2_ENV_FILE: "/app/.env"
  PRESET: "full-vitl-real"
  STEPS: "6000"
  BASE_LR: "1.5e-4"
  WEIGHT_DECAY: "0.05"
  WARMUP_STEPS: "200"
  SEED: "0"
  LOG_EVERY: "10"
  EVAL_EVERY: "500"
  CHECKPOINT_EVERY: "500"

accelerator_count: 1
accelerator_type: tenstorrent.com/chipArch=blackhole
accelerator_pod_resources:
  hugepages-1Gi: 4Gi
