# Starting-point job definition for sparse-sdpa, using the experiment's own pre-built, pre-tested
# workload image (see Dockerfile.workload) rather than the generic dummy-tt-matmul one: it bakes
# in torch, the pinned upstream sparse_sdpa test-utility modules harness.py imports, AND
# harness.py itself, so a pure config/hyperparameter job needs no per-job setup at all --
# `image` + `command: [python3, harness.py]` (the default ENTRYPOINT) + env vars is the whole
# job. Re-run the smoke test (`make sparse-sdpa-workload-image` + a real job) against real
# hardware any time TT_METAL_REF changes before trusting baseline numbers.
# Still just a starting point, not a cap: it's your own job spec, raise cpu/memory/storage
# further any time your workload needs it (a from-source build via build_and_run.sh especially
# is real CPU+RAM heavy).
image: localhost/hypothesisloop-sparse-sdpa-workload:latest

cpu: "8"
memory: "32Gi"
storage: "16Gi"  # from-source builds need real scratch space for build artifacts, not just 1Gi
max_retries: 3

env:
  # Must match this experiment's own Dockerfile.experimentator's TT_METAL_REF exactly, or build_and_run.sh
  # builds against different source than what you read to form your hypothesis.
  TT_METAL_REF: "e45135c5516c6ab18cf855c585d31da684fe64db"

accelerator_count: 1
accelerator_type: tenstorrent.com/chipArch=blackhole
accelerator_pod_resources:
  hugepages-1Gi: 4Gi
