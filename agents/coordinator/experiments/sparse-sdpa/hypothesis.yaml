# What an agent submits with `hl hypothesis submit --file hypothesis.yaml` (system_prompt.md
# step 5). Schema reference: controlplane/settings/examples/hypothesis.yaml.
#
# agent_id/platform_experiment_id are placeholders -- overwrite both at submit time (agent code
# does this automatically; see system_prompt.md's assignment block). They default onto every
# entry in hypotheses: below that doesn't set its own.
agent_id: REPLACE-WITH-YOUR-AGENT-ID
platform_experiment_id: REPLACE-WITH-YOUR-PLATFORM-EXPERIMENT-ID

# One entry per falsifiable idea, each grounded in something real -- never a guess.
hypotheses:
  - text: "REPLACE-WITH-YOUR-FALSIFIABLE-HYPOTHESIS-AND-WHY-YOU-EXPECT-IT"
  # - text: "REPLACE-WITH-A-SECOND-FALSIFIABLE-HYPOTHESIS-AND-WHY-YOU-EXPECT-IT"
  # - text: "REPLACE-WITH-A-THIRD-IDEA-AUTHORED-BY-A-HUMAN"
  #   author: jane # mutually exclusive with agent_id
