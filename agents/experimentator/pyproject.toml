[project]
name = "hypothesisloop-agent"
version = "0.1.0"
description = "LLM-driven research agent for the HypothesisLoop platform"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.121",
    # Official OpenAI Codex SDK — still beta, so pinned exactly; bundles the matching Codex
    # CLI/app-server binary via its openai-codex-cli-bin dependency.
    "openai-codex==0.1.0b3",
    "python-dotenv>=1.0",
]

[project.scripts]
hypothesisloop-agent-claude = "hypothesisloop_agent.claude.run:main"
hypothesisloop-agent-codex = "hypothesisloop_agent.codex.run:main"

[tool.uv]
# openai-codex (beta) pins its bundled CLI binary to an alpha (openai-codex-cli-bin==0.137.0a4);
# uv refuses transitive pre-releases unless told otherwise.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypothesisloop_agent"]
