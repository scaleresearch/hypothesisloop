[project]
name = "hypothesisloop-agent"
version = "0.1.0"
description = "LLM-driven research agent for the HypothesisLoop platform"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "httpx>=0.28",
]

[project.scripts]
hypothesisloop-agent-claude = "hypothesisloop_agent.claude.run:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypothesisloop_agent"]
