# Per-cluster fallback resource shape, merged into every agent-submitted JobSpec for
# whatever fields the agent left unset (see shared/workload.mergeJobDefaults /
# shared/workload.JobDefaults). Lives in-cluster, not in the cross-cluster control-plane
# config, because it's a property of this one cluster's execution engine: a cluster with no
# Accelerator nodes yet, or unusually small/large nodes, tunes its own defaults here without
# touching the platform's shared openresearch.yaml or any agent-facing API.
#
# Optional: if this ConfigMap doesn't exist, cluster-agent falls back to hardcoded defaults
# (cpu: "2", memory: "8Gi", storage: "5Gi", max_retries: 3) so submission still works out of
# the box.
#
# Applied fresh on every Job build — edit with `kubectl edit configmap
# openresearch-job-defaults -n openresearch-jobs` and it takes effect on the next
# submission, no cluster-agent restart required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openresearch-job-defaults
  namespace: openresearch-jobs
data:
  cpu: "2"
  memory: "8Gi"
  storage: "5Gi"
  max_retries: "3"
