# The experiment spec: one platform experiment, keyed like the body of POST /platform-experiments.
# `hl repo init` writes it whole from the platform experiment. To prepare a repository by hand,
# uncomment and fill in, and `hl platform-experiments start DIR --repository R` creates the
# experiment from it. Where the experiment is placed (project, repository, repository_account,
# continues, starts_at) is stated by the request and refused here.
#
# name: a few words                     # required, one line
# description: |                        # required, at most 32768 bytes
#   The brief, the only thing researchers read about the task: the goal, the metric and why it
#   is the goal, what to vary, the gate, how to run a trial, when to stop, and
#   BASELINE
#     config:    the exact configuration
#     trial:     how a researcher runs one trial
#   The platform adds the job that measured it, its code_ref and its values once it is declared.
# metrics:                              # required, at least one of role ranking
#   - key: the_ranked_metric            # the name a job reports the value under
#     direction: maximize               # or minimize
#     role: ranking                     # the default: counts for stage cuts and standings
#     target_vs_baseline: 0.5           # optional: the goal, +50% over the baseline (negative to minimize)
#     deterministic: true               # optional: the same code and data give the same value on any
#                                       # machine (an exact count or check, never a timing)
#   - key: the_gate                     # what makes a result wrong and not merely worse
#     direction: minimize
#     role: constraint                  # a job that breaks the bound or reports no value ranks nowhere
#     bound: 0
#   - key: a_fact                       # attribute: reported and shown, never ranked
#     direction: maximize
#     role: attribute
# budget_accelerator_hours: 10          # required: the cap on everything the run spends, in
#                                       # accelerator-hours, or core-hours for work on CPU cores
# max_agents: 8                         # required: how many researchers may be at work at once
# duration_hours: 24                    # required: how long the run lasts once it starts
# researchers:                          # optional: the researchers to keep at work, at most max_agents
#   - agent_type: generalist            # or hyperparameter-search, architecture-search, data-search
#     model: claude-sonnet-5            # optional: the agent type's, else the platform's default
#     hyperparameters: {}               # optional: a JSON object of at most 4096 bytes
#     count: 2
# coordinator_hosted: true              # the platform runs the coordinator and the baseline agent
# coordinator_model: claude-sonnet-5    # optional: the platform's coordinator default
# report_interval_seconds: 10           # optional: how often a job reports, else the platform's
# stages:                               # optional: the elimination ladder, else the platform's.
#   - length_pct: 40                    # length_pct sums to 100, the last evict_pct is 0, and
#     evict_pct: 75                     # more than one stage needs max_agents of at least 5.
#     max_job_hours: 0.5                # max_job_hours caps a job while the stage runs, 0 none
#   - length_pct: 60
#     evict_pct: 0
# default_quota_tier: guaranteed        # optional: or burst_only, for signups that state none
# max_concurrent_accelerators: 4        # optional: accelerators in flight at once, else the platform's
# agent_image: registry.example.com/team/agent:1   # optional: built FROM the platform's agent image
