{{- if .Values.builder.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hypothesisloop-builder-cache
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.builder.cache.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ required "builder.cache.size is required" .Values.builder.cache.size | quote }}
{{- end }}
