apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypothesisloop-cluster-agent
  namespace: {{ .Release.Namespace }}
---
# Everything the agent changes is in hypothesisloop-jobs, so the rights to change anything are a
# Role there. What it reads outside that namespace is the ClusterRole below, which changes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hypothesisloop-cluster-agent
  namespace: hypothesisloop-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    # get+delete are what deliver a policy termination's checkpoint window. Deleting a Job hands
    # its pods to the garbage collector, which uses the POD's own grace and cannot be told
    # otherwise — so DeleteWorkload deletes the pods itself, with an explicit grace, before
    # touching the Job. Without delete here every teardown 403s and the workload is never
    # removed; without get it cannot read back the grace the pod was compiled with.
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    # FetchLogTail reads a job's own pod's stdout/stderr to report beside its phase. Without
    # this GetLogs 403s, which reads the same as a pod that has not started.
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    # One headless Service per multi-node job, for its pods to find each other.
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    # One ResourceClaimTemplate per job that asks for a DRA device.
    resources: ["resourceclaimtemplates"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    # One image pull Secret per job that runs in an environment, holding the control plane's
    # short-lived login to the private environments repository.
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hypothesisloop-cluster-agent
  namespace: hypothesisloop-jobs
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-cluster-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: hypothesisloop-cluster-agent
  apiGroup: rbac.authorization.k8s.io
---
# Read only. It is what the capacity this cluster reports is counted from: the nodes, every pod
# on them whoever started it, and the DRA devices and the claims that hold them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypothesisloop-cluster-agent-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # kube-system's UID is the identity this cluster reports.
    resources: ["namespaces"]
    resourceNames: ["kube-system", "hypothesisloop-jobs"]
    verbs: ["get"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    resourceNames: ["hypothesisloop-jobs-guaranteed", "hypothesisloop-jobs-burst"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypothesisloop-cluster-agent-reader
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-cluster-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: hypothesisloop-cluster-agent-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-cluster-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: hypothesisloop-cluster-agent
spec:
  # Every replica independently reconciles (the reconcile exchange is idempotent, and
  # Job create/delete are idempotent), so no leader election is needed. One is enough for most
  # deployments, and the only count with the builder, whose cache one daemon owns.
  replicas: 1
  {{- if .Values.builder.enabled }}
  # The old pod goes before the new one starts. Recreate would do the same, and an upgrade to it
  # from an install without the builder is refused: server-side apply keeps the rollingUpdate
  # the API server defaulted, which Recreate forbids.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      app: hypothesisloop-cluster-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-cluster-agent
    spec:
      serviceAccountName: hypothesisloop-cluster-agent
      {{- if .Values.builder.enabled }}
      # The cache volume and the socket are the rootless daemon's user's, and that group reaches
      # them.
      securityContext:
        fsGroup: 1000
      # A sidecar: started, and ready, before the agent, which reports this cluster as one that
      # builds as soon as it runs.
      initContainers:
        - name: buildkitd
          image: {{ .Values.builder.image }}
          restartPolicy: Always
          args:
            - --addr=unix:///run/buildkit/buildkitd.sock
            # Unprivileged, the daemon cannot mount a /proc of its own for a RUN, so a RUN shares
            # the daemon's process namespace.
            - --oci-worker-no-process-sandbox
          resources:
            requests:
              cpu: {{ required "builder.requests.cpu is required" .Values.builder.requests.cpu | quote }}
              memory: {{ required "builder.requests.memory is required" .Values.builder.requests.memory | quote }}
          startupProbe:
            exec:
              command: ["buildctl", "--addr=unix:///run/buildkit/buildkitd.sock", "debug", "workers"]
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            # rootlesskit makes the user namespace the daemon and every RUN live in.
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/buildkit
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
      {{- end }}
      containers:
        - name: cluster-agent
          image: {{ required "images.registry is required" .Values.images.registry }}/hypothesisloop-cluster-agent:{{ required "images.tag is required" .Values.images.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLUSTER_NAME
              value: {{ required "clusterName is required" .Values.clusterName | quote }}
            - name: API_URL
              value: {{ required "apiURL is required" .Values.apiURL | quote }}
            - name: RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hypothesisloop-runtime-token
                  key: token
            # Operator-set claim that this cluster sits behind a native autoscaler
            # (cluster-autoscaler / Karpenter) that reacts to Pending pods. Fail-closed default
            # false: a false positive here costs a job a wasted scale-up deadline, so this is
            # never heuristically detected. See autoscaler.md.
            - name: AUTOSCALER_ENABLED
              value: {{ .Values.autoscalerEnabled | quote }}
            {{- if .Values.builder.enabled }}
            # The daemon this cluster builds environments on. Set, the agent reports that it builds.
            - name: HYPOTHESISLOOP_BUILDS
              value: unix:///run/buildkit/buildkitd.sock
            {{- with .Values.builder.nodeImages.containerdSocket }}
            # Where each environment built is loaded, so a job on this node does not pull it.
            - name: HYPOTHESISLOOP_NODE_IMAGES
              value: /run/node-containerd/containerd.sock
            # The node loaded into, reported as soon as a build is there, so a job is placed on it
            # while the push goes on.
            - name: HYPOTHESISLOOP_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Under the memory limit below, so the Go runtime collects before the kernel kills.
            - name: GOMEMLIMIT
              value: "900MiB"
            {{- end }}
            {{- with .Values.builder.nodeImages.snapshotter }}
            - name: HYPOTHESISLOOP_NODE_SNAPSHOTTER
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            # See node-agent.yaml's resources comment: a tight cpu limit starves
            # the container's own startup handshake, not just its steady-state work. A build's
            # session and output stream are the agent's to hold, and a load streams the whole image
            # through it before the push starts.
            # A load holds the export stream and containerd's import at once, which 128Mi cannot.
            limits:
              cpu: {{ if and .Values.builder.enabled .Values.builder.nodeImages.containerdSocket }}"1"{{ else }}"300m"{{ end }}
              memory: {{ if and .Values.builder.enabled .Values.builder.nodeImages.containerdSocket }}"1Gi"{{ else if .Values.builder.enabled }}"128Mi"{{ else }}"64Mi"{{ end }}
          {{- if .Values.builder.enabled }}
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/buildkit
            {{- if .Values.builder.nodeImages.containerdSocket }}
            - name: node-containerd
              mountPath: /run/node-containerd/containerd.sock
            {{- end }}
          {{- end }}
      # Runs on a node kept free of workloads (local development's no-workload taint) or on a
      # control-plane node, so it has somewhere to run before any workload node is attached.
      # Never a toleration of every taint, as node-agent.yaml has: that covers
      # node.kubernetes.io/unreachable too, so the scheduler binds this one pod to a node whose
      # machine is gone, where it stays Pending and the cluster never connects.
      tolerations:
        - key: hypothesisloop.io/no-workload
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      {{- if .Values.builder.enabled }}
      volumes:
        - name: buildkit-socket
          emptyDir: {}
        - name: buildkit-cache
          persistentVolumeClaim:
            claimName: hypothesisloop-builder-cache
        {{- with .Values.builder.nodeImages.containerdSocket }}
        - name: node-containerd
          hostPath:
            path: {{ . | quote }}
            type: Socket
        {{- end }}
      {{- end }}
