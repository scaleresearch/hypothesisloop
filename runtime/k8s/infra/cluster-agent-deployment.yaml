apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypothesisloop-cluster-agent
  namespace: hypothesisloop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypothesisloop-cluster-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    # nodes: read live CPU capacity/allocatable off real cluster nodes (replaces the old
    # fake-Accelerator-only capacity accounting) — see workload's "get live CPU capacity" step.
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # pods: cluster-wide list to compute actual per-node utilization (workload_client.go's
    # nodeCapacity/nodeUsage path) — same capacity-accounting feature as the nodes rule above.
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    # pods/log: FetchLogTail reads a job's own pod's current stdout/stderr to report alongside
    # its phase (see k8sexec.FetchLogTail, agentloop.LogTailer) — without this, GetLogs 403s and
    # was previously failing silently (job_logs.go's Stream() error path treats any failure as
    # "nothing to report yet", so a permissions error looked identical to a pod that just hasn't
    # started -- confirmed live: no lines were ever reported until this rule was added).
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    # services: one ClusterIP per submitted job (for distributed/multi-node jobs' pod-to-pod
    # discovery), created alongside the Job and deleted with it (workload_client.go create/
    # delete paths).
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    # ResourceClaimTemplates are reconciled with desired Jobs. ResourceSlices and allocated
    # ResourceClaims are the authoritative live DRA capacity/usage source.
    resources: ["resourceclaimtemplates"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypothesisloop-cluster-agent
subjects:
  - kind: ServiceAccount
    name: hypothesisloop-cluster-agent
    namespace: hypothesisloop
roleRef:
  kind: ClusterRole
  name: hypothesisloop-cluster-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypothesisloop-cluster-agent
  namespace: hypothesisloop
  labels:
    app: hypothesisloop-cluster-agent
spec:
  # Every replica independently reconciles (the reconcile exchange is idempotent, and
  # Job create/delete are idempotent), so no leader election is needed — safe to scale this
  # up for availability without any coordination. One is enough for most deployments.
  replicas: 1
  selector:
    matchLabels:
      app: hypothesisloop-cluster-agent
  template:
    metadata:
      labels:
        app: hypothesisloop-cluster-agent
    spec:
      serviceAccountName: hypothesisloop-cluster-agent
      containers:
        - name: cluster-agent
          image: localhost/hypothesisloop-cluster-agent:latest
          imagePullPolicy: Never
          env:
            - name: CLUSTER_NAME
              value: "__CLUSTER_NAME__"
            - name: API_URL
              value: "__API_URL__"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            # See node-agent-daemonset.yaml's resources comment: a tight cpu limit starves
            # the container's own startup handshake, not just its steady-state work.
            limits:
              cpu: "300m"
              memory: "64Mi"
      # Same as node-agent-daemonset.yaml: must always have somewhere to run regardless of
      # whether any workload node is attached (tt-quietbox's no-workload taint).
      tolerations:
        - operator: Exists
