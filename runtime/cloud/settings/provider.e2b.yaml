# The provider section of a config file for one E2B team. A process that rents instances embeds
# it as it is; cloud-agent.yaml explains name and settings.
#
# E2B boots a sandbox from a template. Before an image can be rented at a size, build its
# template: `go run ./runtime/cloud/cmd/e2b-template <image> <cores> <memory-mib>`. A Create whose
# template is missing fails with that command.

provider:
  name: e2b
  settings:
    # The environment variable that holds the team's API key. The key itself is never in a file.
    api_key_env: E2B_API_KEY
    # The longest a sandbox lives. E2B kills it then, with its output. The plan caps it: 3600 on
    # the free plan, 86400 on Pro. A value above the cap fails every Create with the vendor's own
    # message. An instance rented with a shorter lifetime of its own (an agent's, which the
    # control plane decides) is killed at that. One that is wanted for longer has its command
    # ended five minutes before the sandbox, and is listed for those minutes as exited at the
    # plan's lifetime, so whoever rented it can tell that from a sandbox that died and rent
    # another. More than 300.
    lifetime_seconds: 3600

# What the plan allows, which no setting here changes. A spec beyond it is refused: by the
# template build for cores and memory, and by Create for disk, which destroys the sandbox it
# made before starting anything in it.
#   - Cores and memory: up to 8 cores and 8 GiB, fixed by the template.
#   - Disk: the same for every sandbox of a plan and not a thing a template or a spec can ask
#     for. 10 GiB on the free plan (a sandbox there reports 11484 MiB) and 20 GiB on Pro.
#   - Sandboxes at once: 20 on the free plan, 100 on Pro.
#   - Lifetime: one hour on the free plan, 24 hours on Pro; see lifetime_seconds.
#
# A sandbox is made with public traffic off: nothing it listens on answers from outside.
#
# What to set the intervals of the embedding config against: a list of the instances is one
# request for each hundred sandboxes of the team and two more for each instance listed, eight
# instances at a time, about a fifth of a second each. An instance that does not answer is
# reported as running after ten seconds. Reading an instance's output is two requests and gives
# at most 4 MiB.
