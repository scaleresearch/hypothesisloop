# The cloud-agent's one config file: one provider account, registered as one cluster.
# CLOUD_AGENT_CONFIG names the copy the process reads.

cluster_name: rented

# Polled by the agent and handed to every job, so a rented instance must be able to reach it.
api_url: https://api.example.invalid

# What every instance boots. It carries hl, which each job's command runs under.
job_image: registry.example.invalid/hypothesisloop-job:latest

# Part of every instance name: hl-job-<namespace>-... for a job. The agent lists, counts and
# destroys the instances of its namespace only, so agents sharing an account each take their own.
# 1 to 16 lowercase letters and digits.
# Do not change it while instances of this agent exist: the agent would no longer see them, they
# would run and bill unmanaged, and every job still desired would be rented a second time.
namespace: main

# A reconcile pass costs the provider one list call. A status push costs one list call and one
# log read per job whose command has started. Set these against the provider's rate limit.
reconcile_interval_seconds: 10
status_interval_seconds: 10
# How much of a job's output a status push relays.
log_tail_lines: 100

provider:
  # One of the adapters the binary was built with.
  name: example
  # Tells two accounts on one provider apart. With the name it is the cluster's id, which
  # per-cluster settings are keyed on.
  account_id: "1"
  # The adapter's own section. Nothing else reads it.
  settings: {}

# What this account may rent. Each of a shape's max_instances is reported as a node that holds
# one job, so the control plane needs no provider settings of its own, and max_instances bounds
# what can be billed at once. A job is admitted to a shape with exactly the accelerators it asks
# for and at least the cpu, memory and storage, the smallest such shape first, and is rented and
# counted at the shape's whole size.
shapes:
  # name is 1 to 16 lowercase letters and digits. accelerator_type is the resource catalog
  # string, written exactly as jobs request it and as it is priced in the control plane's
  # accelerator_types: a job is only admitted to, and only runs on, a type that matches to the
  # letter.
  - name: h100
    accelerator_type: nvidia.com/gpu.product=NVIDIA-H100
    accelerators: 1
    cpu: "16"
    memory: 64Gi
    storage: 200Gi
    max_instances: 2
  - name: cpu
    cpu: "8"
    memory: 32Gi
    storage: 100Gi
    max_instances: 4
