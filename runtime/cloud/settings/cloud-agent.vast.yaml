# A cloud-agent config for one vast.ai account. cloud-agent.yaml explains the keys every provider
# shares; this file shows the values and the settings section that fit vast.ai.

cluster_name: vast

api_url: https://api.example.invalid

# The image needs sh, grep and curl: on vast.ai each job runs under a supervisor that stops its
# own instance when the job ends, and refuses to start the job without curl.
job_image: registry.example.invalid/hypothesisloop-job:latest

# Do not change it while instances of this agent exist: the agent would no longer see them, they
# would run and bill unmanaged, and every job still desired would be rented a second time.
namespace: main

# One list call per pass. The account's list answered two calls a second without a refusal and
# refused one in eighty at four a second, so ten seconds leaves room for the status pushes and
# for a second agent on the account.
reconcile_interval_seconds: 10
# A push reads the output of every started instance, one after another, and vast.ai takes two to
# four seconds to deliver each read. Allow about three seconds per instance the shapes below can
# hold: 30 for these six, 60 for twenty.
status_interval_seconds: 30
log_tail_lines: 100
# How long a job may wait for a machine to rent before it fails here as no_offer, and how long
# a rented machine may take to start the job before it is destroyed and another rented. The
# control plane bounds each wait on its own: it requeues a job whose stuck-pending timeout (300
# seconds unless the cluster's settings give stuck_pending_timeout_seconds) has passed since
# this runtime first reported the wait the job is in, so the two waits are never added up.
offer_wait_seconds: 180
startup_seconds: 240

provider:
  name: vast
  # The account's user id, as the vast.ai console shows it.
  account_id: "000000"
  settings:
    # The environment variable that holds the account's API key. The key itself is never in a file.
    api_key_env: VAST_API_KEY
    # Offers above this price for the whole instance are never rented.
    max_price_per_hour: 0.60
    # The vendor's own score of a host, 0 to 1.
    min_reliability: 0.98
    # Two-letter country codes. Leave empty for any.
    regions: [SE, NL, DE]
    # Only hosts the vendor has verified.
    verified_only: true
    # Machines never rented. The agent's log names the machine of every instance it rents and of
    # every instance that is slow to start, with what the host says; a machine that keeps
    # failing to start instances goes here.
    excluded_machines: []
    # Every GPU model a shape below names, under both of its names: product as the NVIDIA driver
    # reports it, which is what the catalog string is made from, and gpu_name as vast.ai's offer
    # search returns it. min_gpu_ram_mb tells apart models vast.ai sells under one name.
    accelerators:
      - product: NVIDIA GeForce RTX 4090
        gpu_name: RTX 4090
      - product: NVIDIA A100 80GB PCIe
        gpu_name: A100 PCIE
        min_gpu_ram_mb: 80000

# max_instances is set far above what the platform's experiments ask for at once, so it is no
# limit on how much is rented (owner's decision: no account-wide cap on rented machines). What
# bounds the spend is each experiment's budget, each agent's quota, the experiment's concurrency
# limit and max_price_per_hour. Every instance of the maximum is reported as a node on every
# poll, which is the one reason the number is not larger.
shapes:
  - name: rtx4090
    accelerator_type: nvidia.com/gpu.product=NVIDIA-GEFORCE-RTX-4090
    accelerators: 1
    cpu: "8"
    memory: 32Gi
    storage: 100Gi
    max_instances: 200
  - name: a100
    accelerator_type: nvidia.com/gpu.product=NVIDIA-A100-80GB-PCIE
    accelerators: 1
    cpu: "8"
    memory: 64Gi
    storage: 200Gi
    max_instances: 200
