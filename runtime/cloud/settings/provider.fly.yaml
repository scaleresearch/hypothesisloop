# The provider section of a config file for one Fly.io organization. A process that rents
# instances embeds it as it is; cloud-agent.yaml explains name and settings.

provider:
  name: fly
  settings:
    # The environment variable that holds a deploy token for the app below, as
    # `fly tokens create deploy -a <app>` prints it: "FlyV1 " and the token. The token is never
    # in a file. Use a deploy token and no wider one: it is all the adapter needs, and a token
    # for the organization can create and destroy machines in every app of it.
    api_token_env: FLY_API_TOKEN
    # The one Fly app that holds every machine. It must exist: `fly apps create <name> -o <org>`.
    # The adapter does not create it, and every pass fails with the app's name until it does.
    # Give it a network of its own (`--network <name>`): machines on one network reach each
    # other's ports, and an app created without one shares the organization's default network.
    app: hypothesisloop-agents
    # Three-letter code of the region machines are placed in (`fly platform regions`).
    region: ams
    # shared or performance. A spec gets the smallest machine of this kind that holds its cpu
    # and memory: shared has 1, 2, 4, 6 or 8 cores with 256 MB to 2 GB each, performance 1 to 16
    # cores with 2 to 8 GB each. A spec that fits none of them, asks for more than 50 GB of
    # disk, or asks for an accelerator is refused.
    cpu_kind: performance

# A machine ends when its command does. What the command left running with its output open is
# given five seconds to finish writing and is then stopped with the machine.
#
# What to set the intervals of the embedding config against: the Machines API allows one request
# a second per action and app, with bursts of three. A list of the instances is one request; a
# machine that stopped in the last two minutes adds one log read to it. Reading an instance's
# output is one request to the log API, which gives the last 500 entries: a log_tail_lines above
# about 400 fails once an instance has written that much.
#
# The adapter can warm instances: a Machine created stopped, its image pulled onto its host, which
# an agent-launcher keeps a pool of (warm_pool_size). Starting an agent in one is an update, a
# wait for it and a start, about four seconds, where a create of a 0.9 GB image took seventeen.
# A warm Machine is billed for its root filesystem only.
