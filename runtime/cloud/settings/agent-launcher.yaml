# The agent-launcher's one config file: one provider account, known to the control plane as one
# launcher. AGENT_LAUNCHER_CONFIG names the copy the process reads, and LAUNCHER_TOKEN holds its
# token (scope launcher:<launcher_name>).

# The name this launcher is registered under with the control plane (`hl-admin launcher add`),
# 1 to 16 lowercase letters and digits. The launcher asks for its list under this name and its
# token is accepted for this name only. It is also part of every instance name,
# hl-agent-<launcher_name>-<name the control plane chose>: the launcher lists, creates and
# destroys the instances that start so and no others, which keeps two launchers on one provider
# account apart. The control plane gives newly hosted agents to the launcher its agents.launcher
# names.
#
# The launcher keeps nothing between passes and sees only this prefix on the account of the
# provider section below. Changing provider.name, the account in provider.settings or this name
# leaves the machines rented before where it no longer looks, running and billing: drain first.
launcher_name: main

# Where this process reaches the control plane. The address the agents reach it at is the control
# plane's own services.public_api_url and arrives in each instance's environment.
api_url: https://api.example.invalid

# One pass costs the provider one list call, and a create, start or destroy call for each
# instance that has to change, and the control plane one request. A running agent's output is
# read for its progress once every 15 seconds however fast the passes come. The control plane
# has no way to wake a launcher, so this is also the longest a newly asked for agent waits before
# anything is done for it. Set this against the provider's rate limit: Fly allows one list a
# second with bursts of three.
reconcile_interval_seconds: 2

# Waited between two rentals of one pass (a create, or a warm for the pool below), for a provider
# that limits how fast instances may be rented: the strictest one shipped documents one create a
# second. The first rental of a pass and a start from the pool are never paused for. A provider
# that ends every instance at a fixed age makes all agents of an experiment due at once, and this
# is what spreads their replacements. 0 is no pause.
create_pause_milliseconds: 1000

# How many instances the launcher keeps warm: rented ahead at the size below with the image the
# agents are asked for under, or the platform's own image while none is, that image on their
# host, running nothing. A missing agent is
# started in one of them in seconds, where a create waits for the image's pull, and the pool is
# topped up after. A warm instance is billed for its disk only (on Fly the root filesystem of a
# stopped machine, $0.15 a GB a month), never runs, and is replaced when the agents' image or
# this config changes. The launcher destroys the pool when it stops and when this is 0; one that
# was killed leaves it to the next process under the same launcher_name. Left out, it is 2 on a
# provider that can warm instances (Fly) and 0 on another (E2B).
warm_pool_size: 4

provider:
  # One of the adapters the binary was built with.
  name: example
  # The adapter's own section. Nothing else reads it.
  settings: {}

# What every agent instance runs and how large it is rented. Which image it boots and the
# environment of each agent are the control plane's to say. The size is bound by the provider:
# its section (settings/provider.<name>.yaml) states what it can rent, and a size above that
# fails the create of every agent on every pass, which the log reports as NO AGENT COULD BE
# STARTED. An agent compiles and benchmarks its code here before a job runs it, so the size is a
# Fly performance machine of 8 cores and 16 GiB with its largest disk. E2B rents at most 8 GiB of
# memory and 10 or 20 GiB of disk (settings/provider.e2b.yaml), so a launcher on it needs less.
#
# How long an instance may run is the control plane's to say as well: each one is rented to end
# by itself at the latest moment its platform experiment can still be running, so a launcher
# that is down or cut off leaves nothing running past that. Its command is killed inside the
# machine and compute is no longer billed. A provider that ends every instance at an age of its
# own (settings/provider.<name>.yaml) still does, whichever comes first.
instance:
  # The whole argv, in place of the image's entrypoint.
  # The harness's own interpreter, as the image's entrypoint runs it: uv run would check the
  # environment and build the harness again on every boot.
  command: ["/opt/hypothesisloop-agent/.venv/bin/python3", "-m", "hypothesisloop_agent.claude.run"]
  cpu: "8"
  memory: 16Gi
  storage: 50Gi

# Whose models the agents run on, and what that provider's harness needs in every instance. Each
# env entry is a variable of the instance (name) and the variable of this process that holds its
# value (value_env): the file names variables and never holds a value. The launcher adds them to each instance itself, so the
# credential never passes through the control plane or its database. It is the platform's own
# credential, the same in every agent of every org. Changing a value replaces every running
# instance. Another model provider is its own name and env here and its own command above.
model_provider:
  name: anthropic
  env:
    - name: CLAUDE_CODE_OAUTH_TOKEN
      value_env: CLAUDE_CODE_OAUTH_TOKEN
