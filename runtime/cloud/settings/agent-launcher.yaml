# The agent-launcher's one config file: one provider account, known to the control plane as one
# launcher. AGENT_LAUNCHER_CONFIG names the copy the process reads, and LAUNCHER_TOKEN holds its
# token (scope launcher:<launcher_name>).

# The name the control plane gives hosted agents to: its agents.launcher. The launcher asks for
# its list under this name, and its token is accepted for this name only.
launcher_name: main

# Where this process reaches the control plane. The address the agents reach it at is the control
# plane's own agents.api_url and arrives in each instance's environment.
api_url: https://api.example.invalid

# Part of every instance name: hl-agent-<namespace>-<name the control plane chose>. The launcher
# lists, creates and destroys the instances of its namespace only, so launchers sharing an account
# each take their own. 1 to 16 lowercase letters and digits.
namespace: main

# One pass costs the provider one list call, and a create or destroy call for each instance that
# has to change. Set this against the provider's rate limit.
reconcile_interval_seconds: 15

# Waited between two creates of one pass, for a provider that limits how fast instances may be
# rented: the strictest one shipped documents one create a second. A provider that ends every
# instance at a fixed age makes all agents of an experiment due at once, and this is what spreads
# their replacements. 0 is no pause.
create_pause_milliseconds: 1000

provider:
  # One of the adapters the binary was built with.
  name: example
  # The adapter's own section. Nothing else reads it.
  settings: {}

# What every agent instance runs and how large it is rented. Which image it boots and the
# environment of each agent are the control plane's to say. The size is bound by the provider:
# its section (settings/provider.<name>.yaml) states what it can rent, and a size above that
# fails the create of every agent on every pass, which the log reports as NO AGENT COULD BE
# STARTED. The storage here is under the smallest disk among the providers shipped, about
# 11 GiB; check cpu and memory against the section of the one you configure.
instance:
  # The whole argv, in place of the image's entrypoint.
  command: ["uv", "run", "python3", "-m", "hypothesisloop_agent.claude.run"]
  cpu: "2"
  memory: 4Gi
  storage: 10Gi

# Whose models the agents run on, and what that provider's harness needs in every instance. Each
# env entry is a variable of the instance (name) and the variable of this process that holds its
# value (value_env): the file names variables and never holds a value. The launcher adds them to each instance itself, so the
# credential never passes through the control plane or its database. It is the platform's own
# credential, the same in every agent of every org. Changing a value replaces every running
# instance. Another model provider is its own name and env here and its own command above.
model_provider:
  name: anthropic
  env:
    - name: CLAUDE_CODE_OAUTH_TOKEN
      value_env: CLAUDE_CODE_OAUTH_TOKEN
