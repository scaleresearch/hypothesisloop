# Local control-plane stack: Postgres, GreptimeDB, Memgraph, an S3 store (Silo), control-service, metrics-service.
# Brought up via `make controlplane-up` (podman compose) — nothing here is
# podman-specific; `docker compose -f this-file up` works identically).
#
# Host ports published below are load-bearing, not cosmetic: a k3s job pod (runtime/k8s), the
# cluster-agent/node-agent bundle, `hl` (cli/), the UI dev server, and every test scenario all
# reach this stack the same way production would reach a real deployment — by one HTTP base URL,
# configured externally (API_URL / NEXT_PUBLIC_API_URL / HYPOTHESISLOOP_CONTROL_PLANE_URL), never
# hardcoded. Change a published port here and every one of those needs the same change. Do not
# rename a service either: controlplane/settings/hypothesisloop.yaml's metrics_db_url and
# graph_db_url are the literal DNS names "greptimedb" and "memgraph" (compose's own per-service DNS
# resolves them — no /etc/hosts hack
# needed, unlike the single-pod model this replaces), so a service rename breaks config that is
# otherwise identical between this stack and a real cluster's.

services:
  registry:
    image: docker.io/library/registry:2
    restart: unless-stopped
    environment:
      # Required for prune-images.py's manifest DELETE calls to take effect -- without this the
      # registry accepts the DELETE (204) but never removes the manifest.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "${REGISTRY_PUBLISH_IP:?run through make, which detects the host address}:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hypothesisloop
      POSTGRES_USER: hypothesisloop
      POSTGRES_PASSWORD: hypothesisloop
    ports:
      # Host port 5433, not 5432: leaves a real local Postgres (if the host has one) alone.
      - "5433:5432"
    volumes:
      # No schema here: control-service migrates the database at start (db.Migrate).
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypothesisloop -d hypothesisloop"]
      interval: 2s
      timeout: 3s
      retries: 30

  greptimedb:
    image: docker.io/greptime/greptimedb:latest
    restart: unless-stopped
    command: ["standalone", "start", "--http-addr=0.0.0.0:4000", "--rpc-bind-addr=0.0.0.0:4001"]
    ports:
      - "4010:4000"
      - "4001:4001"
    volumes:
      - greptimedb-data:/tmp/greptimedb-data

  # The hypothesis graph. Pinned: schema bootstrap and the read-only query guard
  # (controlplane/shared/graphdb) were verified against exactly this version. Memgraph holds the
  # graph in memory; the WAL (fsynced on every commit) and periodic snapshots on the volume are what
  # a restart or a crash recovers it from.
  memgraph:
    image: docker.io/memgraph/memgraph:3.13.1
    restart: unless-stopped
    command:
      - --telemetry-enabled=false
      - --data-recovery-on-startup=true
      - --storage-wal-enabled=true
      - --storage-wal-file-flush-every-n-tx=1
      - --storage-snapshot-interval-sec=300
      - --storage-snapshot-on-exit=true
    ports:
      - "7687:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Silo, the maintained MinIO fork: the S3 server plus the MinIO admin API that shared/objectstore
  # creates each job's key with (a service account with an inline policy). MinIO's own images are gone.
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--address", "0.0.0.0:9000"]
    environment:
      MINIO_ROOT_USER: hypothesisloop
      MINIO_ROOT_PASSWORD: hypothesisloop
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["sh", "-c"]
    command:
      - "mcli alias set hl http://minio:9000 hypothesisloop hypothesisloop && mcli mb --ignore-existing hl/hypothesisloop-data"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  control-service:
    image: ${REGISTRY:?run through make, which names the registry}/hypothesisloop-control-service:${TAG:?TAG must name the image tag make images pushed}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hypothesisloop:hypothesisloop@postgres:5432/hypothesisloop?sslmode=disable
      HYPOTHESISLOOP_SIGNING_SECRET: ${HYPOTHESISLOOP_SIGNING_SECRET:?run through make, which supplies local development's signing secret}
      MODEL_ANTHROPIC_OAUTH_TOKEN: ${MODEL_ANTHROPIC_OAUTH_TOKEN:?run through make, which reads it from .env}
      # The git host's secrets, which the rendered settings name (localdev/lib/auth.sh): the
      # GitHub App's two with GIT_HOST_PROVIDER=github, the local git server's password with local.
      # Empty and unread otherwise.
      HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_PRIVATE_KEY: ${HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_PRIVATE_KEY:-}
      HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD: ${HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD:-}
      # With CONTAINER_REGISTRY_PROVIDER=gcp in .env, the control service's own Google identity,
      # which mints the environment registry's tokens: the application default credentials
      # `gcloud auth application-default login` writes to its well-known path, or
      # HL_GOOGLE_CREDENTIALS_FILE. Without either, auth.sh mounts /dev/null and the control
      # service cannot mint them.
      GOOGLE_APPLICATION_CREDENTIALS: /google/credentials.json
    ports:
      - "${API_HOST_PORT:-8081}:8081"
    volumes:
      # Rendered by `make render-settings` (host address substituted into data_store.endpoint) —
      # same file both services mount, same as the pod model this replaces.
      - ../../controlplane/settings/.hypothesisloop.rendered.yaml:/settings/hypothesisloop.yaml:ro
      - ${HL_GOOGLE_CREDENTIALS_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/google/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  metrics-service:
    image: ${REGISTRY:?run through make, which names the registry}/hypothesisloop-metrics-service:${TAG:?TAG must name the image tag make images pushed}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hypothesisloop:hypothesisloop@postgres:5432/hypothesisloop?sslmode=disable
      HYPOTHESISLOOP_SIGNING_SECRET: ${HYPOTHESISLOOP_SIGNING_SECRET:?run through make, which supplies local development's signing secret}
      MODEL_ANTHROPIC_OAUTH_TOKEN: ${MODEL_ANTHROPIC_OAUTH_TOKEN:?run through make, which reads it from .env}
      # The git host's secrets, which the rendered settings name (localdev/lib/auth.sh): the
      # GitHub App's two with GIT_HOST_PROVIDER=github, the local git server's password with local.
      # Empty and unread otherwise.
      HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_PRIVATE_KEY: ${HYPOTHESISLOOP_GIT_HOST_GITHUB_APP_PRIVATE_KEY:-}
      HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD: ${HYPOTHESISLOOP_GIT_HOST_PLAIN_PASSWORD:-}
    ports:
      - "8084:8084"
    volumes:
      - ../../controlplane/settings/.hypothesisloop.rendered.yaml:/settings/hypothesisloop.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  registry-data:
    name: hypothesisloop-registry-data
  postgres-data:
    name: hypothesisloop-postgres-data
  greptimedb-data:
    name: hypothesisloop-greptimedb-data
  memgraph-data:
    name: hypothesisloop-memgraph-data
  minio-data:
    name: hypothesisloop-minio-data
