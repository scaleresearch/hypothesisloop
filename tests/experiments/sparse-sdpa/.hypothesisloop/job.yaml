# The base job spec. Every trial is this file, submitted unedited:
#
#   hl job submit .hypothesisloop/job.yaml --hypothesis ID --theory "..." --env KEY=VALUE
job:
  # ttnn v0.77.0, device firmware and torch, with python3 the venv that holds them.
  image: tenstorrent
  # hl-clone checks out the commit the job was submitted from and prints its directory.
  # tt_metal_tests.sh fetches the upstream test utilities harness.py imports. A change to tt-metal
  # source runs `bash build_and_run.sh harness.py` in place of `python3 harness.py`.
  command: ["bash", "-c", "dir=$(hl-clone) && cd \"$dir\" && bash tt_metal_tests.sh && exec python3 harness.py"]
  accelerator_type: tenstorrent.com/chipArch=blackhole
  accelerator_count: 1
  # The host-side torch golden of the prod-sparse shape needs well over 4Gi, and a build from
  # source needs the cores and the scratch space.
  cpu: 8
  memory: 32Gi
  storage: 16Gi
  env:
    # The commit of tt-metal v0.77.0, the ttnn of the job image: the test utilities are fetched
    # and a source build is made at it.
    TT_METAL_REF: "9f9cd4fd590f4b606bd0981a4fe0b6403eb38ec9"
    TT_METAL_TEST_UTILS_PATH: /workspace/tt-metal-tests
    # One ASIC of a two-chip board is visible to the job, and ttnn's default fabric setup expects
    # the whole board. The single-chip mesh descriptor the image ships describes what the job holds.
    TT_MESH_GRAPH_DESC_PATH: /opt/venv/lib/python3.10/site-packages/ttnn/tt_metal/fabric/mesh_graph_descriptors/p100_mesh_graph_descriptor.textproto
