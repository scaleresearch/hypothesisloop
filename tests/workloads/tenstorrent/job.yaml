# This file is a full POST /experiments request body (id + metadata + job), not just the job
# spec. id/metadata below are placeholders -- nothing here knows in advance which hypothesis or
# platform experiment a submission belongs to, so overwrite hypothesis_id, platform_experiment_id,
# agent_id (and id, for a fresh submission) before/at submit time. The `job:` block below is the
# real, reusable execution definition -- see controlplane/settings/examples/experiment-submission.yaml
# for the fully-commented DSL reference.
id: replace-with-a-unique-job-id
metadata:
  agent_id: REPLACE-WITH-YOUR-AGENT-ID
  platform_experiment_id: REPLACE-WITH-YOUR-PLATFORM-EXPERIMENT-ID
  hypothesis_id: REPLACE-WITH-YOUR-HYPOTHESIS-ID   # from POST /hypotheses or `hl hypothesis submit`
  # project_id: optional free-text grouping tag (GET /experiments?project_id=) -- no Project entity exists, omit if unneeded.
  project_id: ""
  objective: "describe what this run is optimizing for"
  theory: "your specific prediction for this run"
  code_ref: "git://hypothesisloop@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"   # REPLACE with your own <git-remote-url>@<40-hex-commit-sha>
  # config_hash/data_ref: optional reproducibility pointers (hash of the resolved
  # hyperparameter config, where the input dataset lives) -- pure bookkeeping, never
  # validated. Omit both if you have nothing to point at.
  config_hash: ""
  data_ref: ""
  capacity_tier: guaranteed   # or burst_only; omit entirely to default to guaranteed
  estimated_duration_hours: 1.0
job:
  # Standalone job definition for the Tenstorrent real-hardware e2e test — train.py opens the
  # DRA-allocated device via ttnn and runs real matmuls (not the synthetic-metrics stub
  # tests/workloads/generic/train.py uses for every other accelerator type). See
  # tenstorrent/e2e-test.sh, which reads this file and submits it verbatim as the `job` field of
  # POST /experiments, same pattern as tests/workloads/generic/job.yaml.
  #
  # The only thing that makes this job Tenstorrent-specific is accelerator_type below: the
  # control plane's admission loop picks whichever registered cluster reports live capacity for
  # that flavor (see controlplane/settings/hypothesisloop.yaml's tenstorrent.com/chipArch=blackhole entry,
  # allocation_mode: dra) — nothing here names a cluster directly.
  image: localhost/hypothesisloop-tenstorrent-workload:latest

  # memory/cpu sized for the real tt-metal runtime, not the tiny synthetic-stub defaults every
  # other workload here uses: pre-compiled firmware/kernel JIT loading and dispatch buffers for
  # a 4096x4096 bf16 matmul measurably exceed a few hundred MiB — an under-sized limit gets
  # silently OOMKilled mid-run (confirmed: 256Mi OOMKilled every run; 4Gi comfortably clears it
  # with room to spare on this QuietBox's 240GiB allocatable).
  cpu: "2"
  memory: "4Gi"
  storage: "1Gi"
  max_retries: 3

  accelerator_count: 1
  accelerator_type: tenstorrent.com/chipArch=blackhole
  accelerator_pod_resources:
    hugepages-1Gi: 4Gi
