[project]
name = "hypothesisloop-e2e"
version = "0.1.0"
description = "End-to-end tests against a live control plane (API, PostgreSQL, controllers, k8s)."
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "pytest-order>=1.2",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[tool.uv]
# No importable package here (support/ is imported via rootdir on sys.path, the pytest way) --
# this file exists only to pin/manage the test dependencies with uv, not to build a distributable.
package = false

[tool.pytest.ini_options]
testpaths = ["e2e"]
addopts = ["--ignore=experiments"]
markers = [
    "parallel: owns only UUID-namespaced resources, safe beside any other test (xdist-safe)",
    "exclusive: changes what every org sees, such as which clusters are shared, so it runs alone (-n 0)",
    "slow: duration-only marker, orthogonal to isolation — excluded from the default quick loop",
    "hardware: needs real accelerator hardware behavior beyond generic scheduling; skipped unless explicitly requested",
    "real_providers: rents sandboxes or GPU instances at real vendors; skipped unless HL_E2E_RENT is set (make e2e RENT=1)",
]
timeout = 240
timeout_method = "thread"
